<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Togethere" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Zilla+Slab:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />

<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <span class="feijao blob b1"></span>
  <span class="feijao blob b2"></span>
  <span class="feijao blob b3"></span>
  <span class="feijao blob b4"></span>
  <div class="login-card">
    <div class="brand"><img src="logo.png" alt="togethere" class="logo-img" onerror="logoFallback(this)"></div>
    <div class="tagline">inglês para chegar lá</div>
    <h2 id="loginTitulo">Entrar</h2>
    <div id="loginPanel"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <header class="tbar">
    <button class="tb-burger" onclick="_toggleMenu(event)" aria-label="Abrir menu">☰</button>
    <div class="brand"><img src="logo.png" alt="togethere" class="logo-img" onerror="logoFallback(this)"></div>
    <nav class="tnav" id="nav"></nav>
    <div class="tb-right">
      <span id="tbRelogio" class="tb-relogio" title="Horário atual"></span>
      <button class="tb-me" onclick="_togglePerfil(event)" aria-label="Sua conta">
        <span id="meName"></span>
        <span class="dot" id="meDot"></span>
      </button>
      <div class="tb-perfil" id="perfilMenu" onclick="event.stopPropagation()">
        <div id="perfilLabel" style="margin-bottom:10px"></div>
        <button class="btn ghost sm block" onclick="ir('perfil')" style="margin-bottom:8px">👤 Meu perfil</button>
        <button class="btn ghost sm block" id="btnTema" onclick="toggleTema()" style="margin-bottom:8px">🌙 Modo escuro</button>
        <div id="syncDot" onclick="puxarDaNuvem()" style="font-size:.74rem;color:var(--tinta-suave);margin-bottom:8px;cursor:pointer" title="Clique para puxar os dados mais recentes da nuvem">☁️ …</div>
        <button class="btn ghost sm block" onclick="puxarDaNuvem()" style="margin-bottom:8px">🔄 Atualizar (puxar da nuvem)</button>
        <button class="btn ghost sm block" onclick="trocarMinhaSenha()" style="margin-bottom:8px">🔑 Trocar minha senha</button>
        <button class="btn red sm block" onclick="logout()" style="margin-bottom:10px">🚪 Sair</button>
        <div style="font-size:.66rem;color:var(--tinta-suave);text-align:center">versão <span id="appVer"></span></div>
      </div>
    </div>
  </header>
  <div class="pagehead">
    <div class="crumb" id="crumb">Início</div>
    <h1 id="pageTitle">Painel</h1>
  </div>
  <div class="content" id="view"></div>
  <nav class="bnav" id="bnav"></nav>
  <div class="mais-sheet" id="maisMenu" onclick="event.stopPropagation()"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/*__APP_JS__*/
</script>


<script>
/*__VENDOR_QR__*/
</script>
</body>
</html>
