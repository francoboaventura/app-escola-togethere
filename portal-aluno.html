<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Togethere · Portal do Aluno</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --azul:#005EAF; --azul2:#0a6dc4; --amarelo:#FFC800; --vermelho:#E52524;
    --ok:#16A07A; --roxo:#6C4BD8; --ouro:#B8860B;
    --tinta:#10243a; --fraco:#5b6b7c; --linha:#e7eef6; --fundo:#eef3f8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tinta); background:var(--fundo); line-height:1.5; }
  a{ color:var(--azul); }

  /* ---- App bar ---- */
  .appbar{ position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--linha); }
  .appbar .in{ max-width:820px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  .wm{ font-weight:800; font-size:1.25rem; letter-spacing:-.5px; color:var(--azul); }
  .wm b{ color:var(--vermelho); }
  .appbar .tag{ font-style:italic; color:var(--fraco); font-size:.8rem; flex:1; }
  .wrap{ max-width:820px; margin:0 auto; padding:16px; }

  .btn{ font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:12px; padding:10px 14px; background:var(--azul); color:#fff; }
  .btn.ghost{ background:#fff; color:var(--azul); border:1px solid var(--linha); }
  .btn.amarelo{ background:var(--amarelo); color:#10243a; }
  .btn.sm{ padding:7px 12px; font-size:.9rem; }
  .btn:disabled{ opacity:.5; }

  .card{ background:#fff; border:1px solid var(--linha); border-radius:18px; box-shadow:0 8px 30px rgba(0,40,90,.05); }

  /* ---- Login ---- */
  .login{ padding:22px; }
  .login h1{ font-size:1.3rem; margin-bottom:4px; }
  label{ display:block; font-size:.85rem; color:var(--fraco); margin:12px 0 4px; }
  input{ width:100%; padding:13px 14px; border:1px solid var(--linha); border-radius:12px; font:inherit; }
  input:focus{ outline:none; border-color:var(--azul); box-shadow:0 0 0 3px rgba(0,94,175,.12); }
  .msg{ margin-top:12px; font-size:.9rem; padding:9px 12px; border-radius:10px; display:none; }
  .msg.err{ display:block; background:#fdecec; border:1px solid var(--vermelho); color:#a01818; }
  .hint{ color:var(--fraco); font-size:.9rem; }

  /* ---- Hero ---- */
  .hero{ background:linear-gradient(135deg,var(--azul2),var(--azul)); color:#fff; border-radius:20px; padding:20px; display:flex; align-items:center; gap:14px; }
  .avatar{ width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.4rem; flex:none; }
  .hero .nm{ font-size:1.3rem; font-weight:700; line-height:1.1; }
  .hero .tu{ opacity:.9; font-size:.9rem; margin-top:2px; }
  .hero .sair{ margin-left:auto; background:rgba(255,255,255,.16); color:#fff; border:0; }

  /* ---- Tiles ---- */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
  .tile{ background:#fff; border:1px solid var(--linha); border-radius:16px; padding:14px 8px; text-align:center; }
  .tile .v{ font-size:1.6rem; font-weight:800; line-height:1; }
  .tile .l{ font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--fraco); margin-top:5px; }
  @media(max-width:520px){ .tiles{ grid-template-columns:repeat(2,1fr); } }

  /* ---- Tabs ---- */
  .tabs{ display:flex; gap:6px; margin:16px 0 4px; background:#e6edf6; padding:5px; border-radius:14px; }
  .tab{ flex:1; text-align:center; padding:9px 6px; border-radius:10px; font-weight:600; font-size:.92rem; color:var(--fraco); cursor:pointer; border:0; background:transparent; }
  .tab.on{ background:#fff; color:var(--azul); box-shadow:0 2px 8px rgba(0,40,90,.08); }

  /* ---- Accordion sections ---- */
  .sec{ margin-top:12px; overflow:hidden; }
  .sec-h{ width:100%; display:flex; align-items:center; gap:12px; padding:15px 16px; background:#fff; border:0; cursor:pointer; font:inherit; text-align:left; }
  .sec-i{ font-size:1.15rem; }
  .sec-t{ flex:1; font-weight:700; }
  .badge{ min-width:24px; text-align:center; font-size:.8rem; font-weight:700; padding:2px 8px; border-radius:999px; background:#eef3f8; color:var(--azul); }
  .badge.warn{ background:#FBF3D6; color:var(--ouro); }
  .badge.bad{ background:#FDECEC; color:var(--vermelho); }
  .chev{ color:var(--fraco); transition:transform .2s; }
  .sec.open .chev{ transform:rotate(180deg); }
  .sec-b{ display:none; padding:2px 16px 14px; }
  .sec.open .sec-b{ display:block; }
  .li{ padding:9px 0; border-top:1px solid var(--linha); font-size:.93rem; }
  .li:first-child{ border-top:0; }
  .vazio{ color:#9aa6b6; font-style:italic; font-size:.9rem; padding:6px 0; }

  .doc{ width:100%; height:70vh; border:1px solid var(--linha); border-radius:14px; background:#fff; display:block; }
  .item{ display:flex; align-items:center; gap:10px; padding:13px 4px; border-top:1px solid var(--linha); flex-wrap:wrap; }
  .item:first-child{ border-top:0; }
  .item .t{ flex:1; min-width:160px; } .item .t b{ display:block; } .item .t span{ color:var(--fraco); font-size:.85rem; }
  .tipo{ font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; background:#eef3f8; color:var(--azul); padding:3px 8px; border-radius:999px; font-weight:700; }

  .rowbtn{ display:flex; justify-content:flex-end; margin:12px 2px 0; }
  .hide{ display:none !important; }
  .foot{ text-align:center; color:var(--fraco); font-size:.8rem; margin:26px 0; }
  .spin{ width:22px; height:22px; border:3px solid var(--linha); border-top-color:var(--azul); border-radius:50%; animation:g 1s linear infinite; display:inline-block; }
  @keyframes g{ to{ transform:rotate(360deg); } }
  .center{ text-align:center; padding:30px 0; }
</style>
</head>
<body>

<div class="appbar"><div class="in"><span class="wm">togeth<b>e</b>re</span><span class="tag">portal do aluno</span></div></div>

<div class="wrap">
  <!-- LOGIN -->
  <div id="telaLogin" class="card login">
    <h1>Entrar</h1>
    <p class="hint">Acesse com o e-mail e a senha que a escola criou para você.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="voce@exemplo.com">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="sua senha">
    <div style="margin-top:16px"><button class="btn" id="btnEntrar" style="width:100%">Entrar</button></div>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- APP -->
  <div id="app" class="hide">
    <div class="hero">
      <div class="avatar" id="avatar">·</div>
      <div><div class="nm" id="nm">—</div><div class="tu" id="tu"></div></div>
      <button class="btn sm sair" id="btnSair">Sair</button>
    </div>

    <div id="tilesBox" class="tiles hide"></div>

    <div id="erroBox" class="card hide" style="padding:18px;margin-top:14px"><p class="hint" id="erroTxt"></p></div>

    <div id="tabs" class="tabs hide"></div>

    <div id="tabAcomp"></div>

    <div id="tabBoletim" class="hide">
      <div class="rowbtn"><button class="btn amarelo sm" id="btnBoletimPDF">🖨️ Baixar PDF</button></div>
      <iframe id="boletimFrame" class="doc" title="Boletim" style="margin-top:8px"></iframe>
    </div>

    <div id="tabDocs" class="hide">
      <div class="card" style="padding:16px;margin-top:12px">
        <div id="lista"></div>
      </div>
    </div>

    <div class="center" id="carregando"><span class="spin"></span></div>
  </div>

  <div class="foot">Togethere · Gravataí/RS — <i>inglês para chegar lá</i></div>
</div>

<!-- viewer p/ documentos extras -->
<div id="viewerWrap" class="wrap hide">
  <div class="card" style="padding:14px">
    <div style="display:flex;align-items:center;gap:8px"><b id="vTitulo" style="flex:1">Relatório</b>
      <button class="btn amarelo sm" id="btnPDF">🖨️ PDF</button>
      <button class="btn ghost sm" id="btnFechar">Fechar</button></div>
    <iframe id="vFrame" class="doc" title="Relatório" style="margin-top:10px"></iframe>
  </div>
</div>

<!-- iframe oculto p/ imprimir a ficha em PDF -->
<iframe id="printFrame" title="print" style="position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0"></iframe>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPA_URL = 'https://wkmmlbzrfkkalcsxxtze.supabase.co';
const SUPA_KEY = 'sb_publishable_CD6tvB_DTCH-QSfDNavreg_wtiKiWI1';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const $ = id => document.getElementById(id);
let DATA=null, RELS=[];

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function brDate(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return d.toLocaleDateString('pt-BR'); }
function tipoLabel(t){ return ({ficha:'Ficha',boletim:'Boletim',writing:'Writing',aula:'Aula'})[t]||(t||'Relatório'); }
function setDoc(fr, html){ try{ if(fr._u){URL.revokeObjectURL(fr._u);} const b=new Blob([html||''],{type:'text/html;charset=utf-8'}); fr._u=URL.createObjectURL(b); fr.src=fr._u; }catch(e){ fr.srcdoc=html||''; } }
function printFrame(fr){ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ alert('Use o menu do navegador para salvar em PDF.'); } }

/* ---------- Ficha: parse do texto do servidor ---------- */
function parseFicha(txt){
  const linhas=String(txt||'').split('\n');
  const isHeader=l=>/^[\u{1F300}-\u{1FAFF}☀-➿←-⇿⬀-⯿]/u.test(l);
  const secoes=[]; let atual=null;
  for(const raw of linhas){ const l=raw.replace(/\s+$/,''); if(!l.trim())continue;
    if(isHeader(l)){ atual={titulo:l.trim(), itens:[]}; secoes.push(atual); }
    else if(atual){ atual.itens.push(l.replace(/^•\s*/,'').trim()); } }
  return secoes;
}
function num(txt, re){ const m=String(txt).match(re); return m?+m[1]:null; }
function contHead(t){ const m=String(t||'').match(/\((\d+)\)\s*$/); return m?+m[1]:null; }
function secCfg(t){
  if(/AULAS/i.test(t)) return {icon:'📅', label:'Faltas (com o conteúdo perdido)', filtro:it=>/FALTOU/i.test(it), badge:'bad'};
  if(/TEMAS/i.test(t)) return {icon:'📚', label:'Temas pendentes', badge:'warn'};
  if(/MATERIAL/i.test(t)) return {icon:'🎒', label:'Material não trazido', badge:'warn'};
  if(/TESTES/i.test(t)) return {icon:'📝', label:'Testes'};
  if(/WRITING/i.test(t)) return {icon:'✍️', label:'Writings'};
  if(/COMENT/i.test(t)) return {icon:'💬', label:'Comentários'};
  return {icon:'•', label:t.replace(/^[^A-Za-zÀ-ú]+/,'')};
}

/* ---------- Render principal ---------- */
function renderPainel(data){
  DATA=data;
  const nome=data.nome||'', turma=data.turma||'';
  $('nm').textContent = nome || 'Aluno';
  $('tu').textContent = turma;
  $('avatar').textContent = (nome.trim()[0]||'·').toUpperCase();

  const secoes = parseFicha(data.ficha);
  const pres = num(data.ficha, /Presen[çc]as:\s*(\d+)/i);
  const falt = num(data.ficha, /Faltas:\s*(\d+)/i);
  const temas = (secoes.find(s=>/TEMAS/i.test(s.titulo))||{}); const temasN = contHead(temas.titulo);
  const mat = (secoes.find(s=>/MATERIAL/i.test(s.titulo))||{}); const matN = contHead(mat.titulo);

  // tiles
  const tile=(v,l,cls)=>`<div class="tile"><div class="v" style="color:${cls}">${v==null?'—':v}</div><div class="l">${l}</div></div>`;
  $('tilesBox').innerHTML =
      tile(pres, 'Presenças', 'var(--ok)')
    + tile(falt, 'Faltas', (falt>0)?'var(--vermelho)':'var(--tinta)')
    + tile(temasN, 'Temas pend.', (temasN>0)?'var(--ouro)':'var(--tinta)')
    + tile(matN, 'Material', (matN>0)?'var(--ouro)':'var(--tinta)');
  $('tilesBox').classList.remove('hide');

  // seções (accordion) — pula FREQUÊNCIA (virou tiles)
  const box=$('tabAcomp');
  box.innerHTML='<div class="rowbtn"><button class="btn amarelo sm" id="btnFichaPDF">🖨️ Baixar ficha em PDF</button></div>';
  secoes.filter(s=>!/FREQU/i.test(s.titulo)).forEach((s,idx)=>{
    const cfg=secCfg(s.titulo);
    let itens=s.itens.filter(it=> it && it!=='—' && !/^Togethere/i.test(it));
    if(cfg.filtro) itens=itens.filter(cfg.filtro);
    const vazia = itens.length===0 || (itens.length===1 && /^Nenhum/i.test(itens[0]));
    const n = vazia?0:itens.length;
    const badgeCls = n===0 ? '' : (cfg.badge||'');
    const corpo = vazia ? '<div class="vazio">Nada no período.</div>'
      : itens.map(it=>`<div class="li">${esc(it)}</div>`).join('');
    const abre = (!vazia && idx<2) ? ' open' : '';   // abre as 2 primeiras com conteúdo
    const el=document.createElement('div');
    el.className='card sec'+abre;
    el.innerHTML=`<button class="sec-h" onclick="this.parentNode.classList.toggle('open')">
        <span class="sec-i">${cfg.icon}</span><span class="sec-t">${esc(cfg.label)}</span>
        <span class="badge ${badgeCls}">${n}</span><span class="chev">▾</span></button>
      <div class="sec-b">${corpo}</div>`;
    box.appendChild(el);
  });

  // tabs
  const temBoletim = !!(data.boletim && data.boletim.html);
  const temDocs = RELS.length>0;
  buildTabs(temBoletim, temDocs);

  if(temBoletim){ setDoc($('boletimFrame'), data.boletim.html); }
}

function buildTabs(temBoletim, temDocs){
  const abas=[{id:'acomp', label:'Acompanhamento'}];
  if(temBoletim) abas.push({id:'boletim', label:'Boletim'});
  if(temDocs) abas.push({id:'docs', label:'Documentos'});
  const t=$('tabs');
  if(abas.length<=1){ t.classList.add('hide'); mostrarAba('acomp'); return; }
  t.classList.remove('hide');
  t.innerHTML=abas.map((a,i)=>`<button class="tab${i===0?' on':''}" data-aba="${a.id}" onclick="mostrarAba('${a.id}',this)">${a.label}</button>`).join('');
  mostrarAba('acomp');
}
function mostrarAba(id, btn){
  $('tabAcomp').classList.toggle('hide', id!=='acomp');
  $('tabBoletim').classList.toggle('hide', id!=='boletim');
  $('tabDocs').classList.toggle('hide', id!=='docs');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.aba===id));
}

/* ---------- Ficha em PDF (documento limpo) ---------- */
function fichaDocHTML(){
  if(!DATA) return '';
  const nome=esc(DATA.nome||''), turma=esc(DATA.turma||'');
  const secoes=parseFicha(DATA.ficha);
  const pres=num(DATA.ficha,/Presen[çc]as:\s*(\d+)/i), falt=num(DATA.ficha,/Faltas:\s*(\d+)/i);
  const temasN=contHead((secoes.find(s=>/TEMAS/i.test(s.titulo))||{}).titulo);
  const matN=contHead((secoes.find(s=>/MATERIAL/i.test(s.titulo))||{}).titulo);
  const tile=(v,l,c,b)=>`<td width="25%" style="padding:5px"><table width="100%" style="background:${b};border-radius:10px"><tr><td style="padding:12px 6px;text-align:center"><div style="font-size:22px;font-weight:bold;color:${c}">${v==null?'—':v}</div><div style="font-size:10px;color:#5b6b7c;text-transform:uppercase">${l}</div></td></tr></table></td>`;
  const tiles=`<table width="100%"><tr>${tile(pres,'Presenças','#16A07A','#E6F6F0')}${tile(falt,'Faltas',(falt>0)?'#E52524':'#5b6b7c',(falt>0)?'#FDECEC':'#f1f4f8')}${tile(temasN,'Temas',(temasN>0)?'#B8860B':'#5b6b7c',(temasN>0)?'#FBF3D6':'#f1f4f8')}${tile(matN,'Material',(matN>0)?'#B8860B':'#5b6b7c',(matN>0)?'#FBF3D6':'#f1f4f8')}</tr></table>`;
  const secHTML=secoes.filter(s=>!/FREQU/i.test(s.titulo)).map(s=>{
    const cfg=secCfg(s.titulo);
    let itens=s.itens.filter(it=> it && it!=='—' && !/^Togethere/i.test(it));
    if(cfg.filtro) itens=itens.filter(cfg.filtro);
    const vazia=itens.length===0||(itens.length===1&&/^Nenhum/i.test(itens[0]));
    const corpo=vazia?'<div style="color:#9aa6b6;font-style:italic;font-size:13px">Nada no período.</div>':itens.map(it=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid #eef2f7">${esc(it)}</div>`).join('');
    return `<div style="margin-top:14px"><div style="font-weight:bold;color:#005EAF;font-size:14px">${cfg.icon} ${esc(cfg.label)}</div>${corpo}</div>`;
  }).join('');
  return '<!doctype html><html><head><meta charset="utf-8"></head><body style="font-family:Arial,sans-serif;color:#10243a;margin:0;padding:16px;max-width:720px">'
    +`<div style="background:#005EAF;color:#fff;padding:18px 20px;border-radius:12px"><div style="font-size:20px;font-weight:bold">togeth<span style="color:#FFC800">e</span>re</div><div style="font-size:13px;opacity:.9">Ficha de acompanhamento</div></div>`
    +`<div style="padding:12px 2px;border-bottom:3px solid #FFC800;margin-bottom:8px"><b style="color:#005EAF;font-size:16px">${nome}</b> <span style="color:#5b6b7c;font-size:13px">· ${turma}</span></div>`
    +tiles+secHTML
    +'<div style="margin-top:18px;color:#5b6b7c;font-size:12px;text-align:center;border-top:1px solid #e7eef6;padding-top:10px">Togethere · Gravataí/RS — inglês para chegar lá</div>'
    +'</body></html>';
}

/* ---------- Documentos extras ---------- */
async function carregarExtras(){
  try{
    const { data, error } = await sb.from('relatorios_aluno').select('*').order('publicado_em',{ascending:false});
    if(error) return;
    RELS = (data||[]).filter(r=>r.tipo!=='ficha' && r.tipo!=='boletim');
    if(!RELS.length) return;
    $('lista').innerHTML = RELS.map((r,i)=>`<div class="item"><span class="tipo">${esc(tipoLabel(r.tipo))}</span>
      <div class="t"><b>${esc(r.titulo||tipoLabel(r.tipo))}</b><span>Publicado em ${brDate(r.publicado_em)}</span></div>
      <button class="btn ghost sm" onclick="abrirExtra(${i})">Abrir</button></div>`).join('');
  }catch(e){}
}
function abrirExtra(i){
  const r=RELS[i]; if(!r) return;
  $('vTitulo').textContent=r.titulo||tipoLabel(r.tipo);
  const html=(r.html&&r.html.trim())?r.html:'<!doctype html><meta charset="utf-8"><body style="font-family:system-ui,sans-serif;padding:20px;white-space:pre-wrap">'+esc(r.texto||'')+'</body>';
  setDoc($('vFrame'), html);
  $('viewerWrap').classList.remove('hide');
  $('viewerWrap').scrollIntoView({behavior:'smooth'});
}

/* ---------- Login / carga ---------- */
function msgLogin(t){ const m=$('loginMsg'); m.textContent=t; m.className='msg err'; }
async function entrar(){
  const email=($('email').value||'').trim(), senha=$('senha').value||'';
  if(!email||!senha) return msgLogin('Preencha e-mail e senha.');
  $('btnEntrar').disabled=true; $('btnEntrar').textContent='Entrando…';
  try{ const { error }=await sb.auth.signInWithPassword({ email, password:senha });
    if(error){ msgLogin('E-mail ou senha incorretos.'); return; }
    await abrirApp();
  }catch(e){ msgLogin('Falha de conexão. Tente de novo.'); }
  finally{ $('btnEntrar').disabled=false; $('btnEntrar').textContent='Entrar'; }
}
async function abrirApp(){
  const { data:{ user } } = await sb.auth.getUser(); if(!user) return;
  $('telaLogin').classList.add('hide'); $('app').classList.remove('hide');
  $('carregando').classList.remove('hide');
  await carregarExtras();
  try{
    const { data, error } = await sb.functions.invoke('minha-ficha');
    if(error) throw new Error(error.message||'falha ao carregar');
    if(data && data.ok){ renderPainel(data); }
    else { erro((data&&data.error)||'Não consegui carregar a sua ficha.'); }
  }catch(e){ erro('Não consegui carregar a sua ficha. Detalhe: '+((e&&e.message)||e)); }
  $('carregando').classList.add('hide');
}
function erro(t){ $('erroBox').classList.remove('hide'); $('erroTxt').textContent=t; }
async function sair(){ try{ await sb.auth.signOut(); }catch(e){} location.reload(); }

$('btnEntrar').onclick=entrar;
$('senha').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });
$('btnSair').onclick=sair;
$('btnBoletimPDF').onclick=()=>printFrame($('boletimFrame'));
$('btnPDF').onclick=()=>printFrame($('vFrame'));
$('btnFechar').onclick=()=>$('viewerWrap').classList.add('hide');
