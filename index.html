function montarFichaEmailHTML(alunoId, de, ate){
  const a=(S.alunos||[]).find(x=>x.id===alunoId)||{};
  const turma=(S.turmas||[]).find(t=>t.id===a.turmaId)||{};
  const txt=corpoFichaAluno(alunoId, de, ate);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const periodo=(de||ate)?((de?brDate(de):'início')+' a '+(ate?brDate(ate):'hoje')):'todo o histórico';

  // Parse do texto em seções (cabeçalho começa com emoji; itens com "•")
  const linhas=String(txt||'').split('\n');
  const isHeader=l=>/^[\u{1F300}-\u{1FAFF}☀-➿←-⇿⬀-⯿]/u.test(l);
  const secoes=[]; let atual=null;
  for(const raw of linhas){
    const l=raw.replace(/\s+$/,'');
    if(!l.trim()) continue;
    if(isHeader(l)){ atual={titulo:l.trim(), itens:[]}; secoes.push(atual); }
    else if(atual){ atual.itens.push(l.replace(/^•\s*/,'').trim()); }
  }

  // Indicadores (tiles)
  const numDe=re=>{ const m=String(txt).match(re); return m?m[1]:null; };
  const pres=numDe(/Presen[çc]as:\s*(\d+)/i);
  const falt=numDe(/Faltas:\s*(\d+)/i);
  const contHead=t=>{ const m=String(t||'').match(/\((\d+)\)\s*$/); return m?+m[1]:null; };
  const temasSec=secoes.find(x=>/TEMAS/i.test(x.titulo));
  const matSec=secoes.find(x=>/MATERIAL/i.test(x.titulo));
  const temasN=temasSec?contHead(temasSec.titulo):null;
  const matN=matSec?contHead(matSec.titulo):null;
  const tile=(label,val,cor,bg)=>'<td width="25%" style="padding:5px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:'+bg+';border-radius:10px;"><tr><td style="padding:12px 6px;text-align:center;"><div style="font-size:22px;font-weight:bold;color:'+cor+';line-height:1;">'+(val==null?'—':esc(''+val))+'</div><div style="font-size:10px;color:#5b6b7c;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;">'+esc(label)+'</div></td></tr></table></td>';
  const tiles='<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>'
    + tile('Presenças', pres, '#16A07A', '#E6F6F0')
    + tile('Faltas', falt, (falt&&+falt>0)?'#E52524':'#5b6b7c', (falt&&+falt>0)?'#FDECEC':'#f1f4f8')
    + tile('Temas pend.', temasN, (temasN&&temasN>0)?'#B8860B':'#5b6b7c', (temasN&&temasN>0)?'#FBF3D6':'#f1f4f8')
    + tile('Material', matN, (matN&&matN>0)?'#B8860B':'#5b6b7c', (matN&&matN>0)?'#FBF3D6':'#f1f4f8')
    + '</tr></table>';

  // Seções no corpo (frequência vira tiles; aulas viram só as faltas)
  const corDe=t=>/TEMA|MATERIAL/i.test(t)?'#B8860B':/TESTE|WRITING/i.test(t)?'#6C4BD8':/AULA|FALTA/i.test(t)?'#E52524':'#005EAF';
  const secHTML=secoes.filter(x=>!/FREQU/i.test(x.titulo)).map(sec=>{
    let titulo=sec.titulo, itens=sec.itens.slice().filter(it=> it && it!=='—' && !/^Togethere/i.test(it));
    if(/AULAS/i.test(titulo)){ itens=itens.filter(it=>/FALTOU/i.test(it)); titulo='📅 Faltas no período (com o conteúdo perdido)'; }
    const vazia = itens.length===0 || (itens.length===1 && /^Nenhum/i.test(itens[0]));
    const cor=corDe(titulo);
    const corpo = vazia
      ? '<div style="font-size:13px;color:#9aa6b6;font-style:italic;">Nada no período.</div>'
      : itens.map(it=>'<div style="font-size:13px;color:#233;padding:4px 0;border-bottom:1px solid #eef2f7;">'+esc(it)+'</div>').join('');
    return '<tr><td style="padding:16px 24px 2px;"><div style="font-weight:bold;color:'+cor+';font-size:14px;">'+esc(titulo)+'</div></td></tr>'
      + '<tr><td style="padding:4px 24px 6px;">'+corpo+'</td></tr>';
  }).join('');

function renderPlanos(){
  const list=document.getElementById('plList');
  const raw=(_buscaPlano||'').trim(), q=_normTxt(raw);
  const base=(painelTurma?S.planos.filter(p=>p.turmaId===painelTurma):[...S.planos]);
  if(q){
    const ps=base.filter(p=> _normTxt(p.titulo).includes(q) || _normTxt(p.conteudo||'').includes(q) || _normTxt(turmaNome(p.turmaId)).includes(q) || p.data.includes(raw) || brDate(p.data).includes(raw)).sort((a,b)=>b.data.localeCompare(a.data));
    list.innerHTML = ps.length ? ps.map(planoCard).join('') : `<div class="card empty"><div class="big">🔎</div>Nenhum plano encontrado.</div>`;
    return;
  }
  const pend=base.filter(p=>!p.realizado).sort((a,b)=>a.data.localeCompare(b.data));
  const feitos=base.filter(p=>p.realizado).sort((a,b)=>b.data.localeCompare(a.data));
  if(!pend.length && !feitos.length){ list.innerHTML=`<div class="card empty"><div class="big">✅</div>Nenhum plano de aula ainda. Crie um novo no botão acima.</div>`; return; }
  let html=`<p style="font-weight:700;margin:4px 0 8px;opacity:.7">⏳ Pendentes (${pend.length})</p>`;
  html += pend.length ? pend.map(planoCard).join('') : '<p class="hint" style="margin:0 0 8px">Nenhum plano pendente.</p>';
  html += `<p style="font-weight:700;margin:20px 0 8px;opacity:.7">✓ Realizados (${feitos.length})</p>`;
  html += feitos.length ? feitos.map(planoCard).join('') : '<p class="hint" style="margin:0">Nenhum plano realizado ainda.</p>';
  list.innerHTML=html;
}
function marcarPlanoFeito(pid){if(soLeitura())return toast('Somente leitura — a secretaria não edita turmas');const p=S.planos.find(p=>p.id===pid);if(!p)return;p.realizado=true;p.realizadoEm=hoje();p.atualizadoEm=Date.now();save();renderPlanos();toast('Plano marcado como feito');}

function transferirPlanoProximaAula(pid){

  if(!t||!t.dias||!t.dias.length)return toast('Defina os dias de aula da turma para poder transferir');

  const prox=proximaEntrega(p.turmaId,origem);
  if(!prox||prox<=origem)return toast('Não encontrei uma próxima data de aula para esta turma');
  if(!confirm('Transferir este plano para a próxima aula?\n\nDe '+brDate(origem)+'  →  para '+brDate(prox)+'\n\nA aula de '+brDate(origem)+' continua valendo (as faltas ficam registradas), mas o plano passa para a próxima data — sem gerar relatório nem cobrança para aquele dia.'))return;

function corpoRelatorioDia(turmaId,dataAula){
  const turma=S.turmas.find(t=>t.id===turmaId)||{};
  const planos=S.planos.filter(p=>p.turmaId===turmaId && p.data===dataAula);
  const materia=planos.map(p=>p.conteudo||p.titulo).filter(Boolean).join(' · ');
  const feitos=[].concat(...planos.map(p=>(p.itens||[]).filter(i=>i.done).map(i=>i.txt)));
  const temas=S.temas.filter(t=>t.turmaId===turmaId && t.data===dataAula);
  const anota=planos.map(p=>p.anotacoes).filter(Boolean).join(' ');
  let b=`Olá, famílias! 👋\n\nResumo da aula de ${brDate(dataAula)} — turma ${turma.nome}.\n\n`;
  b+=`📖 Matéria do dia: ${materia||'(registrar no plano de aula)'}\n`;
  if(feitos.length) b+=`✅ Trabalhamos: ${feitos.join(', ')}.\n`;
  if(temas.length){ b+=`\n📚 Tema de casa:\n`+temas.map(t=>`• ${t.descricao}${t.dataEntrega?` (entrega ${brDate(t.dataEntrega)})`:''}`).join('\n')+`\n`; }
  else { b+=`\n📚 Tema de casa: sem tema para esta aula\n`; }
  if(anota) b+=`\n📝 Observações: ${anota}\n`;
  b+=`\n${(S.config&&S.config.assinatura)||ASSINATURA_PADRAO}`;
  return b;
}

function copiarTexto(txt, msg){
  txt=String(txt||'');
  if(!txt) return toast('Nada para copiar');
  const ok=()=>toast(msg||'Copiado!');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, ()=>fallbackCopia(txt,msg));
  } else { fallbackCopia(txt,msg); }
}
function fallbackCopia(txt,msg){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    const sucesso=document.execCommand('copy');
    document.body.removeChild(ta);
    toast(sucesso ? (msg||'Copiado!') : 'Não foi possível copiar — selecione manualmente');
  }catch(e){ toast('Não foi possível copiar — selecione manualmente'); }
}

const ARQ_LIMITE=20;
function _turmasComAluno(qn){ const ids=new Set(); S.alunos.forEach(a=>{ if(_normTxt(a.nome).includes(qn)) ids.add(a.turmaId); }); return ids; }
// Lista unificada de relatórios ENVIADOS (aula por turma + ficha por aluno), ordenada pela data de envio (mais recentes em cima).
function _arquivoItens(){
  const out=[];
  (S.relatorios||[]).forEach(r=>{
    if(!r.enviado) return;
    out.push({ tipo:'aula', id:r.id, ts:(r.enviadoTs||_ymdToTs(r.enviadoEm||r.data)), em:(r.enviadoEm||r.data),
      turmaId:r.turmaId, titulo:turmaNome(r.turmaId), dataAula:r.data, por:r.criadoPor||'' });
  });
  (S.alunos||[]).forEach(a=>{
    (Array.isArray(a.relatoriosEnviados)?a.relatoriosEnviados:[]).forEach(e=>{
      out.push({ tipo:'aluno', id:a.id+'@'+(e.ts||e.em), ts:(e.ts||_ymdToTs(e.em)), em:e.em,
        turmaId:a.turmaId, alunoId:a.id, titulo:a.nome, via:(e.via||''), por:(e.por||'') });
    });
  });
  out.sort((x,y)=>(y.ts||0)-(x.ts||0));
  const seen=new Set(); const dedup=[];
  out.forEach(it=>{ if(seen.has(it.id)) return; seen.add(it.id); dedup.push(it); });   // sem duplicidade
  return dedup;
}
function filtrarArquivo(busca){
  const q=(busca||'').trim(), qn=_normTxt(q);
  let rs=_arquivoItens();
  if(q){
    const turmasAluno=_turmasComAluno(qn);   // casa busca por nome de aluno nos relatórios de aula
    rs=rs.filter(it=>{
      const titulo=_normTxt(it.titulo);                       // turma (aula) ou nome (aluno)
      const nomeTurma=_normTxt(turmaNome(it.turmaId));
      const dataMatch=(it.em||'').includes(q) || brDate(it.em).includes(q)
        || (it.dataAula && (it.dataAula.includes(q) || brDate(it.dataAula).includes(q)));
      const alunoMatch=it.tipo==='aluno' ? titulo.includes(qn) : turmasAluno.has(it.turmaId);
      return titulo.includes(qn) || nomeTurma.includes(qn) || alunoMatch || dataMatch;
    });
  }
  return rs;
}
function renderArquivo(){
  const box=document.getElementById('arqHist'); if(!box) return;
  const todos=filtrarArquivo(_arqBusca);
  const buscando=!!(_arqBusca||'').trim();
  const rs=buscando ? todos : todos.slice(0,ARQ_LIMITE);
  const cnt=document.getElementById('arqCount');
  if(cnt) cnt.textContent = buscando
    ? (todos.length+' resultado(s)')
    : ('mostrando os '+rs.length+' mais recentes'+(todos.length>rs.length?(' · '+todos.length+' no total'):''));
  if(!rs.length){ box.innerHTML='<p class="hint">'+(buscando?'Nenhum relatório enviado encontrado.':'Nenhum relatório enviado ainda.')+'</p>'; return; }
  box.innerHTML=rs.map(it=>{
    const t=S.turmas.find(x=>x.id===it.turmaId)||{};
    if(it.tipo==='aluno'){
      const viaTxt=it.via==='email'?'e-mail':it.via==='whatsapp'?'WhatsApp':it.via==='pdf'?'PDF':'';
      const sub=[t.nome?esc(t.nome):'', viaTxt, it.por?esc(it.por):''].filter(Boolean).join(' · ');
      return `<div class="check"><span style="flex:1">${brDate(it.em)} · 📄 <b>${esc(it.titulo)}</b> <span class="pill" style="background:#eef4ff;color:var(--azul)">aluno</span>${sub?`<br><small class="hint">${sub}</small>`:''}</span>
        <button class="btn ghost sm" onclick="verRelAlunoArquivo('${it.alunoId}','${it.ts}')">ver</button></div>`;
    }
    return `<div class="check"><span style="flex:1">${brDate(it.em)} · 🧾 <b>${esc(t.nome||'—')}</b> <span class="pill" style="background:#e7f6ef;color:var(--ok)">turma</span><br><small class="hint">aula ${brDate(it.dataAula)}${it.por?' · gerado por '+esc(it.por):''}</small></span>
      <button class="btn ghost sm" onclick="verRelArquivo('${it.id}')">ver</button>
      <button class="btn ghost sm" onclick="copiarRelatorioFamilia('${it.id}')">📋</button></div>`;
  }).join('');
}

function verRelAlunoArquivo(alunoId, ts){
  const a=(S.alunos||[]).find(x=>x.id===alunoId); if(!a)return;
  const reg=(a.relatoriosEnviados||[]).find(r=>String(r.ts)===String(ts)); if(!reg)return;
  const t=S.turmas.find(x=>x.id===a.turmaId)||{};
  const viaTxt=reg.via==='email'?'e-mail':reg.via==='whatsapp'?'WhatsApp':reg.via==='pdf'?'PDF':'';

  modal(`<h3>${esc(a.nome)} <button class="close" onclick="fechar()">×</button></h3>
    <p class="hint" style="margin:0 0 8px">📄 Relatório por aluno${t.nome?' · '+esc(t.nome):''} · enviado em ${brDate(reg.em)}${viaTxt?' ('+viaTxt+')':''}</p>${aviso}
    ${corpo?`<div class="gen-box">${escAttr(corpo)}</div>`:''}
    <div class="row" style="margin-top:10px;gap:8px">${corpo?`<button class="btn amarelo" onclick="copiarTexto(${JSON.stringify(corpo)},'Copiado!')">📋 Copiar</button>`:''}
    <button class="btn ghost" onclick="fechar();abrirFicha('${alunoId}')">📇 Abrir ficha atual</button></div>`);
}

// --- Converter entre aluno de turma e VIP (só direção). Preserva o histórico arquivando a origem. ---
function alunoParaVip(alunoId){
  if(ehProfessor()) return toast('Sem permissão para alterar a modalidade do aluno');
  const a=(S.alunos||[]).find(x=>x.id===alunoId); if(!a) return;
  if(!confirm('Transformar "'+a.nome+'" em aluno VIP? Ele sai da turma (o histórico é preservado) e passa a ter aulas VIP individuais.')) return;
  const tOrig=(S.turmas||[]).find(x=>x.id===a.turmaId);
  S.vipAlunos.push({id:uid(), nome:a.nome, professor:(tOrig&&tOrig.professor)||''});
  vipSel=S.vipAlunos[S.vipAlunos.length-1].id;
  a.arquivado=true; a.atualizadoEm=Date.now();
  save(); montarNav(); toast(a.nome+' agora é aluno VIP'); ir('vip');
}
function vipParaAluno(vipId){
  if(ehProfessor()) return toast('Sem permissão para alterar a modalidade do aluno');
  const v=(S.vipAlunos||[]).find(x=>x.id===vipId); if(!v) return;
  const destinos=(S.turmas||[]).filter(t=>!t.arquivada).sort((x,y)=>(x.nome||'').localeCompare(y.nome||''));
  if(!destinos.length) return toast('Crie uma turma ativa primeiro');
  modal(`<h3>Mover VIP para turma <button class="close" onclick="fechar()">×</button></h3>
    <p class="hint" style="margin:0 0 8px"><b>${esc(v.nome)}</b> deixará de ser VIP e entrará como aluno de turma. O histórico das aulas VIP é preservado.</p>
    <div class="field"><label class="lbl">Turma de destino</label>
      <select id="vpDestino">${destinos.map(t=>`<option value="${t.id}">${esc(t.nome)}${t.professor?' · '+esc(t.professor):''}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn" onclick="confirmarVipParaAluno('${vipId}')">Confirmar</button><button class="btn ghost" onclick="fechar()">Cancelar</button></div>`);
}
function confirmarVipParaAluno(vipId){
  if(ehProfessor()) return toast('Sem permissão para alterar a modalidade do aluno');
  const v=(S.vipAlunos||[]).find(x=>x.id===vipId); if(!v) return;
  const destino=(document.getElementById('vpDestino')||{}).value;
  const t=(S.turmas||[]).find(x=>x.id===destino); if(!t) return toast('Selecione a turma de destino');
  S.alunos.push({id:uid(), nome:v.nome, turmaId:t.id});
  v.arquivado=true; v.atualizadoEm=Date.now();
  if(vipSel===vipId) vipSel=null;
  save(); fechar(); montarNav(); toast(v.nome+' movido para '+t.nome); ir('turmas');
}
function addVipAluno(){
  const nome=(document.getElementById('vipNome').value||'').trim(); if(!nome)return toast('Digite o nome');
  let professor;
  if(S.perfil==='direcao'){ professor=((document.getElementById('vipProf')||{}).value||'').trim(); if(!professor) return toast('Escolha o professor responsável'); }
  else { professor=_meuEnsina(); }
  const a={id:uid(),nome,professor}; S.vipAlunos.push(a); vipSel=a.id; save(); VIEWS.vip(); toast('Aluno VIP cadastrado');
}
function trocarProfVip(vipId, prof){
  if(ehProfessor()) return;
  const v=(S.vipAlunos||[]).find(x=>x.id===vipId); if(!v) return;
  v.professor=(prof||'').trim(); v.atualizadoEm=Date.now();
  save(); toast(v.professor?('VIP agora é de '+v.professor):'Professor removido do VIP');
}
function delVipAluno(id){
  if(!confirm('Excluir este aluno VIP e todas as suas aulas?'))return;
  S.aulasVip.filter(x=>x.vipId===id).forEach(x=>marcarExcluido('aulasVip',x.id)); marcarExcluido('vipAlunos',id);
  S.vipAlunos=S.vipAlunos.filter(a=>a.id!==id); S.aulasVip=S.aulasVip.filter(x=>x.vipId!==id);
  if(vipSel===id)vipSel=null; save(); VIEWS.vip(); toast('Aluno VIP excluído');
}
function addAulaVip(){
  const vid=vipSel; if(!vid)return toast('Selecione um aluno VIP');
  const tema=(document.getElementById('vipTema').value||'').trim();
  const desc=document.getElementById('vipDesc').value.trim(); if(!desc)return toast('Descreva a aula');
  const data=document.getElementById('vipData').value; if(!data)return toast('Escolha a data');
  const dur=+document.getElementById('vipDur').value||0;
  const faltou=!!document.getElementById('vipFaltou').checked;
  S.aulasVip.push({id:uid(),vipId:vid,data,tema,descricao:desc,duracaoMin:dur,faltou,atualizadoEm:Date.now()});
  save(); renderVipLista();
  const t=document.getElementById('vipTema'); if(t)t.value='';
  const d=document.getElementById('vipDesc'); if(d)d.value='';
  const f=document.getElementById('vipFaltou'); if(f)f.checked=false;
  toast(faltou?'Aula lançada (não compareceu)':'Aula lançada');
}
function delAulaVip(id){ if(!confirm('Excluir esta aula VIP?'))return; S.aulasVip=S.aulasVip.filter(x=>x.id!==id); marcarExcluido('aulasVip',id); save(); renderVipLista(); }

function salvarEdicaoAulaVip(id){
  if(soLeitura())return toast('Somente leitura — a secretaria não edita aulas VIP');
  const a=S.aulasVip.find(x=>x.id===id); if(!a)return;

  a.tema=(document.getElementById('evTema').value||'').trim();
  a.descricao=desc;
  a.data=document.getElementById('evData').value||a.data;
  a.duracaoMin=+document.getElementById('evDur').value||0;
  a.faltou=!!document.getElementById('evFaltou').checked;
  a.atualizadoEm=Date.now();                 // carimbo para a sincronização entre aparelhos
  save(); fechar(); renderVipLista(); toast('Aula atualizada');
}
function renderVipLista(){
  const box=document.getElementById('vipBox'); if(!box)return;
  const vid=vipSel, al=S.vipAlunos.find(a=>a.id===vid);
  if(!vid||!al){ box.innerHTML=''; return; }
  const aulas=S.aulasVip.filter(x=>x.vipId===vid).sort((a,b)=>b.data.localeCompare(a.data));
  const comp=aulas.filter(a=>!a.faltou); const compMin=comp.reduce((s,a)=>s+(+a.duracaoMin||0),0);
  const faltas=aulas.length-comp.length;
  let h=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h3 style="margin:0;flex:1">Aulas de ${al.nome}</h3>
    <button class="btn ghost sm" onclick="abrirFicha('${vid}')">📇 Ficha</button>
    <button class="btn amarelo sm" ${aulas.length?'':'disabled style="opacity:.5;cursor:not-allowed"'} onclick="copiarRelatorioVip()">📋 Copiar relatório</button>
    <button class="btn ghost sm" style="color:var(--vermelho)" onclick="delVipAluno('${vid}')">excluir aluno</button></div>`;
  if(!aulas.length){ box.innerHTML=h+'<p class="hint" style="margin:8px 0 0">Nenhuma aula lançada ainda.</p>'; return; }
  h+=`<p class="hint" style="margin:8px 0 10px"><b>${comp.length}</b> aula(s) com presença (${fmtDur(compMin)})${faltas?` · <b>${faltas}</b> falta(s)`:''}</p>`;
  h+=aulas.map(a=>`<div class="check"><span style="flex:1">${brDate(a.data)} · ${a.tema?`<b>${esc(a.tema)}</b> — `:''}<span style="white-space:pre-wrap">${esc(a.descricao)}</span> <span class="pill">${fmtDur(a.duracaoMin)}</span>${a.faltou?' <span class="pill" style="background:#ffe9e9;color:var(--vermelho)">não compareceu</span>':''}</span><button class="btn ghost sm" onclick="editarAulaVip('${a.id}')">✏️ editar</button><button class="btn ghost sm" style="color:var(--vermelho)" onclick="delAulaVip('${a.id}')">excluir</button></div>`).join('');
  box.innerHTML=h;
}
function corpoRelatorioVip(vid){
  const al=S.vipAlunos.find(a=>a.id===vid); if(!al)return'';
  const aulas=S.aulasVip.filter(x=>x.vipId===vid).sort((a,b)=>a.data.localeCompare(b.data));
  const comp=aulas.filter(a=>!a.faltou); const compMin=comp.reduce((s,a)=>s+(+a.duracaoMin||0),0);
  const faltas=aulas.length-comp.length;
  let b=`Relatório de aulas VIP — ${al.nome}\n`;
  if(aulas.length) b+=`Período: ${brDate(aulas[0].data)} a ${brDate(aulas[aulas.length-1].data)}\n`;
  b+=`\n`+aulas.map(a=>`• ${brDate(a.data)} — ${a.tema?a.tema+': ':''}${a.descricao} (${fmtDur(a.duracaoMin)})${a.faltou?' — NÃO COMPARECEU':''}`).join('\n');
  b+=`\n\nAulas com presença: ${comp.length} (${fmtDur(compMin)})${faltas?` · Faltas: ${faltas}`:''}\n`;
  b+=`\n${(S.config&&S.config.assinatura)||ASSINATURA_PADRAO}`;
  return b;
}

function gerarResumo(){
  const turmaId=document.getElementById('rT').value, data=document.getElementById('rD').value;
  const turma=S.turmas.find(t=>t.id===turmaId);
  const plano=S.planos.find(p=>p.turmaId===turmaId&&p.data===data);
  const tema=S.temas.find(t=>t.turmaId===turmaId&&t.data===data);
  const feitos=plano?plano.itens.filter(i=>i.done).map(i=>i.txt):[];
  let txt=`Olá, famílias! 👋\n\nResumo da aula de hoje (${brDate(data)}) — ${turma.nome}:\n\n`;
  if(plano){
    txt+=`📖 Conteúdo: ${plano.conteudo||plano.titulo}\n`;
    if(feitos.length)txt+=`✅ Trabalhamos: ${feitos.join(', ')}.\n`;
  }else{
    txt+=`📖 Tivemos mais um dia de aprendizado de inglês!\n`;
  }
  if(tema)txt+=`\n📚 Tema de casa: ${tema.descricao}\n`;
  else txt+=`\n📚 Hoje não passamos tema de casa.\n`;
  txt+=`\nQualquer dúvida, estamos à disposição.\nEquipe Togethere 💙\ninglês para chegar lá`;
  document.getElementById('rOut').textContent=txt;
}
function copiarResumo(){
  const t=document.getElementById('rOut').textContent;

}
// resumo do que foi dado numa aula (para os dias de falta)
function resumoAulaDoDia(turmaId,data){
  const plano=S.planos.find(p=>p.turmaId===turmaId&&p.data===data);
  const tema=S.temas.find(t=>t.turmaId===turmaId&&t.data===data);
  let s='';
  if(plano){ s=plano.conteudo||plano.titulo; const f=plano.itens.filter(i=>i.done).map(i=>i.txt); if(f.length)s+=' (trabalhado: '+f.join(', ')+')'; }
  if(tema) s+=(s?' | ':'')+'Tema passado: '+tema.descricao;
  return s||'aula não registrada no sistema';
}
function corpoRelatorioAluno(alunoId,turmaId,de,ate){
  const inRange=d=> (!de||d>=de) && (!ate||d<=ate);
  const aluno=S.alunos.find(a=>a.id===alunoId), turma=S.turmas.find(t=>t.id===turmaId);
  const faltas=faltasDoAluno(alunoId,turmaId).filter(inRange), mat=materialDoAluno(alunoId,turmaId).filter(inRange);
  const temas=temasNaoFeitosDoAluno(alunoId,turmaId).filter(t=>inRange(t.data)), coms=comentariosDoAluno(alunoId).filter(c=>inRange(c.data));
  const atrasos=atrasosDoAluno(alunoId,turmaId).filter(inRange), saidas=saidasCedoDoAluno(alunoId,turmaId).filter(inRange);
  const peso=pesoFalta(turmaId);
  const baseF=Number(aluno.faltasRetro)||0, totalF=baseF+faltas.length;
  let txt=`RELATÓRIO DO ALUNO\n${aluno.nome}\nTurma: ${turma.nome}${turma.professor?' · Prof. '+turma.professor:''}\nPeríodo: ${de?brDate(de):'início'} a ${ate?brDate(ate):'hoje'}\nGerado em ${brDate(hoje())} por ${S.usuario}\n`;
  txt+=`\n📋 FALTAS (${totalF}${peso===2?` — turma com 2 aulas por encontro`:''})\n`;
  if(baseF) txt+=`• ${baseF} falta(s) retroativas (registro manual)\n`;
  if(faltas.length) faltas.forEach(d=>{ txt+=`• ${brDate(d)} — conteúdo da aula: ${resumoAulaDoDia(turmaId,d)}\n`; });
  if(!totalF) txt+=`• Nenhuma falta registrada.\n`;
  txt+=`\n⏰ CHEGOU ATRASADO (${atrasos.length})\n`;
  if(atrasos.length) atrasos.forEach(d=>{ txt+=`• ${brDate(d)}\n`; }); else txt+=`• Nenhum registro.\n`;
  txt+=`\n🚪 SAIU MAIS CEDO (${saidas.length})\n`;
  if(saidas.length) saidas.forEach(d=>{ txt+=`• ${brDate(d)}\n`; }); else txt+=`• Nenhum registro.\n`;
  txt+=`\n🎒 MATERIAL NÃO TRAZIDO (${mat.length})\n`;
  if(mat.length) mat.forEach(d=>{ txt+=`• ${brDate(d)}\n`; }); else txt+=`• Nenhum registro.\n`;
  txt+=`\n📚 TEMAS DE CASA NÃO FEITOS / PARCIAIS (${temas.length})\n`;
  if(temas.length) temas.forEach(t=>{ txt+=`• ${brDate(t.data)} — ${t.descricao}${t.origem==='plano'?' (do plano de aula)':' (extra)'} — ${t.status==='parcial'?'parcialmente feito':'não feito'}\n`; }); else txt+=`• Nenhum registro.\n`;
  const wrsR=(S.writings||[]).filter(w=>w.alunoId===alunoId && inRange(w.data)).sort((x,y)=>x.data.localeCompare(y.data));
  txt+=`\n📝 WRITINGS (${wrsR.length})\n`;
  if(wrsR.length) wrsR.forEach(w=>{ const bt=(w.subscales||Object.keys(w.bands||{})).map(k=>WR_LBL(k)+' '+(w.bands[k]!=null?w.bands[k]:'—')).join(', '); txt+=`• ${brDate(w.data)} — ${w.levelLabel||w.level||''}${w.taskLabel?(' · '+w.taskLabel):''} — Geral ${w.overall_band!=null?w.overall_band:'—'}/5 (${bt})${w.togethere_band?(' · '+w.togethere_band):''}\n`; }); else txt+=`• Nenhum.\n`;
  txt+=`\n💬 COMENTÁRIOS (${coms.length})\n`;
  if(coms.length) coms.forEach(c=>{ txt+=`• ${brDate(c.data)} (${c.autor}): ${c.texto}\n`; }); else txt+=`• Nenhum comentário.\n`;
  txt+=`\n—\nTogethere · inglês para chegar lá`;
  return txt;
}

  _relatorioHTML=r.html; _relatorioTxt=r.txt;

  if(vz) vz.style.display='none';
}
function addComentario(){
  const alunoId=document.getElementById('relA').value;
  if(!alunoId)return toast('Escolha o aluno');
  const txt=document.getElementById('relCom').value.trim();
  if(!txt)return toast('Escreva o comentário');
  S.comentarios.push({id:uid(),alunoId,data:hoje(),texto:txt,autor:S.usuario});
  document.getElementById('relCom').value=''; save(); toast('Comentário adicionado');
  if(_relatorioHTML) gerarRelatorioAluno();

  {k:'compreensao', t:'Dificuldade de compreensão'},
  {k:'fala',        t:'Dificuldade de fala (speaking)'},
  {k:'escrita',     t:'Dificuldade de escrita / leitura'},
  {k:'faltas',      t:'Faltas frequentes'},
  {k:'tema',        t:'Não faz o tema de casa'},
  {k:'defasagem',   t:'Defasagem em relação à turma'},
  {k:'foco',        t:'Comportamento / foco em aula'},
  {k:'recuperar',   t:'Recuperar conteúdo perdido'},
];
const APOIO_STATUS={
  pendente:{lbl:'Aguardando direção', bg:'#fff8e0', cor:'#b88600'},
  aprovado:{lbl:'Encaminhado à secretaria', bg:'#eaf3ff', cor:'var(--azul)'},
  agendado:{lbl:'Agendado', bg:'#eafaf0', cor:'#1a8a4a'},
  recusado:{lbl:'Não aprovado', bg:'#fdeaea', cor:'var(--vermelho)'},
};
function apoioMotivosTxt(m){ return (m||[]).map(k=>{const o=MOTIVOS_APOIO.find(x=>x.k===k);return o?o.t:k;}); }
function apoioAlunoNome(ap){ const a=S.alunos.find(a=>a.id===ap.alunoId); return a?a.nome:(ap.alunoNome||'—'); }
function apoioAlunoEmail(ap){ const a=S.alunos.find(a=>a.id===ap.alunoId); return a?(a.email||'').trim():''; }
function _apoioData(ts){ if(!ts) return ''; try{ return new Date(ts).toLocaleDateString('pt-BR'); }catch(e){ return ''; } }
// indicações que exigem AÇÃO do perfil atual (para o badge do menu)
function apoioBadge(){
  const aps=(S.apoios||[]).filter(a=>!a.excluido);
  if(S.perfil==='direcao')    return aps.filter(a=>a.status==='pendente').length;
  if(S.perfil==='secretaria') return aps.filter(a=>a.status==='aprovado').length;
  return 0;
}
// o professor só enxerga as indicações que ele mesmo criou; direção/secretaria veem todas
function apoiosVisiveis(){
  const aps=(S.apoios||[]).filter(a=>!a.excluido);
  if(S.perfil==='professor'){
    const u=S.usuarios.find(u=>u.nome===S.usuario);
    return aps.filter(a=>a.criadoPor===S.usuario || (u&&u.ensina&&a.professor===u.ensina));
  }
  return aps;
}

function _apoioOpcoesAluno(turmaId){
  const als=S.alunos.filter(a=>a.turmaId===turmaId && !a.arquivado).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!als.length) return '<option value="">(turma sem alunos)</option>';
  return '<option value="">Selecione o aluno…</option>'+als.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join('');
}
function abrirNovoApoio(){
  const ts=turmasVisiveis().filter(t=>turmaStatus(t)!=='encerrada').sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!ts.length) return toast('Nenhuma turma disponível');
  const t0=ts[0].id;
  modal(`<h3 style="margin-bottom:6px">🤝 Encaminhar para aula de apoio</h3>
    <p class="hint" style="margin-bottom:14px">A direção vai analisar e, se aprovar, a secretaria agenda com o responsável.</p>
    <div class="field"><label class="lbl">Turma</label>
      <select id="apTurma" onchange="_apoioTurmaChange()">${ts.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div>
    <div class="field"><label class="lbl">Aluno</label>
      <select id="apAluno">${_apoioOpcoesAluno(t0)}</select></div>
    <div class="field"><label class="lbl">Motivos da indicação</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        ${MOTIVOS_APOIO.map(m=>`<label class="check" style="cursor:pointer"><input type="checkbox" class="apMotivo" value="${m.k}" style="width:auto;margin-right:8px"> ${m.t}</label>`).join('')}
      </div></div>
    <div class="field"><label class="lbl">Observação (opcional)</label>
      <textarea id="apObs" rows="3" placeholder="Detalhe a situação do aluno para a direção…"></textarea></div>
    <div class="row" style="margin-top:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarApoio()">Enviar indicação</button>
    </div>`);
}
function _apoioTurmaChange(){
  const tid=document.getElementById('apTurma').value;
  document.getElementById('apAluno').innerHTML=_apoioOpcoesAluno(tid);
}
function salvarApoio(){
  const turmaId=document.getElementById('apTurma').value;
  const alunoId=document.getElementById('apAluno').value;
  if(!alunoId) return toast('Escolha o aluno');
  const motivos=[...document.querySelectorAll('.apMotivo:checked')].map(c=>c.value);
  if(!motivos.length) return toast('Marque ao menos um motivo');
  const obs=(document.getElementById('apObs').value||'').trim();
  const t=S.turmas.find(x=>x.id===turmaId)||{};
  const now=Date.now();
  S.apoios.push({
    id:uid(), alunoId, turmaId,
    professor:(t.professor||'').trim(),
    criadoPor:S.usuario,
    motivos, obs,
    status:'pendente',
    parecer:'', decididoPor:'', decididoEm:0,
    agendaData:'', agendaHora:'', secretariaObs:'',
    criadoEm:now, atualizadoEm:now
  });
  save(); montarNav(); fechar(); VIEWS.apoio();
  toast('Indicação enviada à direção ✅');
}

/* ----- direção: aprovar / recusar ----- */
function abrirDecisaoApoio(id){
  const ap=S.apoios.find(a=>a.id===id); if(!ap) return;
  modal(`<h3 style="margin-bottom:6px">Analisar indicação</h3>
    <p class="hint" style="margin-bottom:12px"><b>${esc(apoioAlunoNome(ap))}</b> · ${esc(turmaNome(ap.turmaId))}<br>
      Indicado por ${esc(ap.professor||ap.criadoPor)}</p>
    <div class="card" style="background:#f7f9fd;margin-bottom:12px">
      <b style="font-size:.9rem">Motivos</b>
      <div style="margin:6px 0">${apoioMotivosTxt(ap.motivos).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')}</div>
      ${ap.obs?`<p class="hint" style="margin-top:6px">📝 ${esc(ap.obs)}</p>`:''}
    </div>
    <div class="field"><label class="lbl">Parecer da direção (obrigatório se recusar)</label>
      <textarea id="apParecer" rows="3" placeholder="Ex.: aprovado, priorizar reforço de speaking…">${esc(ap.parecer||'')}</textarea></div>
    <div class="row" style="margin-top:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="fechar()">Cancelar</button>
      <button class="btn" style="background:var(--vermelho)" onclick="decidirApoio('${id}','recusado')">Não aprovar</button>
      <button class="btn" onclick="decidirApoio('${id}','aprovado')">Aprovar e encaminhar</button>
    </div>`);
}
function decidirApoio(id,decisao){
  const ap=S.apoios.find(a=>a.id===id); if(!ap) return;
  const parecer=(document.getElementById('apParecer').value||'').trim();
  if(decisao==='recusado' && !parecer) return toast('Explique o motivo da recusa no parecer');
  ap.status=decisao; ap.parecer=parecer;
  ap.decididoPor=S.usuario; ap.decididoEm=Date.now(); ap.atualizadoEm=Date.now();
  save(); montarNav(); fechar(); VIEWS.apoio();
  toast(decisao==='aprovado'?'Aprovado e encaminhado à secretaria ✅':'Indicação não aprovada');
}

/* ----- secretaria: registrar agendamento ----- */
function abrirAgendarApoio(id){
  const ap=S.apoios.find(a=>a.id===id); if(!ap) return;
  const email=apoioAlunoEmail(ap);
  modal(`<h3 style="margin-bottom:6px">📆 Agendar aula de apoio</h3>
    <p class="hint" style="margin-bottom:12px"><b>${esc(apoioAlunoNome(ap))}</b> · ${esc(turmaNome(ap.turmaId))}<br>
      Responsável: ${email?esc(email):'<span style="color:var(--vermelho)">sem e-mail cadastrado</span>'}</p>
    <div class="row">
      <div class="field" style="flex:1"><label class="lbl">Data</label><input type="date" id="apData" value="${escAttr(ap.agendaData||'')}"></div>
      <div class="field" style="flex:1"><label class="lbl">Horário</label><input type="time" id="apHora" value="${escAttr(ap.agendaHora||'')}"></div>
    </div>
    <div class="field"><label class="lbl">Observação da secretaria (opcional)</label>
      <textarea id="apSecObs" rows="2" placeholder="Ex.: responsável contatado, confirmado por WhatsApp…">${esc(ap.secretariaObs||'')}</textarea></div>
    <div class="row" style="margin-top:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="confirmarAgendaApoio('${id}')">Marcar como agendado</button>
    </div>`);
}
function confirmarAgendaApoio(id){
  const ap=S.apoios.find(a=>a.id===id); if(!ap) return;
  const data=document.getElementById('apData').value;
  if(!data) return toast('Informe a data do agendamento');
  ap.agendaData=data;
  ap.agendaHora=document.getElementById('apHora').value||'';
  ap.secretariaObs=(document.getElementById('apSecObs').value||'').trim();
  ap.status='agendado'; ap.atualizadoEm=Date.now();
  save(); montarNav(); fechar(); VIEWS.apoio();
  toast('Aula de apoio agendada ✅');
}
function excluirApoio(id){
  if(!confirm('Remover esta indicação de aula de apoio?')) return;
  const ap=S.apoios.find(a=>a.id===id); if(ap) ap.excluido=true;
  marcarExcluido('apoios',id);
  save(); montarNav(); VIEWS.apoio(); toast('Indicação removida');
}

VIEWS.apoio=()=>{
  const v=document.getElementById('view');
  const aps=apoiosVisiveis().sort((a,b)=>(b.atualizadoEm||b.criadoEm)-(a.atualizadoEm||a.criadoEm));
  const podeIndicar=(S.perfil==='professor'||S.perfil==='direcao');
  v.innerHTML=`<div class="section-title"><span class="feijao fj" style="background:var(--rosa)"></span><h2 class="display">Aula de apoio</h2></div>
    <p class="sub">Encaminhamento de alunos para reforço — do professor à direção, e da direção à secretaria.</p>`;
  if(podeIndicar) v.appendChild(el(`<div style="margin-bottom:14px"><button class="btn" onclick="abrirNovoApoio()">➕ Nova indicação</button></div>`));

  if(S.perfil==='professor'){
    if(!aps.length){ v.appendChild(el('<div class="card empty"><div class="big">🤝</div><b>Nenhuma indicação ainda</b><br>Use o botão acima para encaminhar um aluno para aula de apoio.</div>')); return; }
    v.appendChild(el(`<h3 style="margin:6px 0 10px;font-size:1rem">Suas indicações (${aps.length})</h3>`));
    aps.forEach(ap=>v.appendChild(el(_apoioCard(ap, ap.status==='pendente'?`<button class="btn ghost sm" onclick="excluirApoio('${ap.id}')">🗑 Cancelar</button>`:''))));
    return;
  }
  if(S.perfil==='direcao'){
    const pend=aps.filter(a=>a.status==='pendente');
    const resto=aps.filter(a=>a.status!=='pendente');
    v.appendChild(el(`<h3 style="margin:6px 0 10px;font-size:1rem">⏳ Aguardando sua aprovação (${pend.length})</h3>`));
    if(!pend.length) v.appendChild(el('<div class="card"><p class="hint" style="margin:0">Nenhuma indicação pendente.</p></div>'));
    pend.forEach(ap=>v.appendChild(el(_apoioCard(ap, `<button class="btn sm" onclick="abrirDecisaoApoio('${ap.id}')">Analisar</button><button class="btn ghost sm" onclick="excluirApoio('${ap.id}')">🗑</button>`))));
    v.appendChild(el(`<h3 style="margin:22px 0 10px;font-size:1rem">📋 Histórico (${resto.length})</h3>`));
    if(!resto.length) v.appendChild(el('<div class="card"><p class="hint" style="margin:0">Sem histórico ainda.</p></div>'));
    resto.forEach(ap=>v.appendChild(el(_apoioCard(ap, `<button class="btn ghost sm" onclick="excluirApoio('${ap.id}')">🗑 Remover</button>`))));
    return;
  }
  // secretaria
  const paraAgendar=aps.filter(a=>a.status==='aprovado');
  const agendadas=aps.filter(a=>a.status==='agendado');
  v.appendChild(el(`<h3 style="margin:6px 0 10px;font-size:1rem">🔔 Para agendar (${paraAgendar.length})</h3>`));
  if(!paraAgendar.length) v.appendChild(el('<div class="card empty"><div class="big">✅</div><b>Nada para agendar</b><br>Nenhuma indicação aprovada aguardando agendamento.</div>'));
  paraAgendar.forEach(ap=>v.appendChild(el(_apoioCard(ap, `<button class="btn sm" onclick="abrirAgendarApoio('${ap.id}')">📆 Agendar</button>`))));
  v.appendChild(el(`<h3 style="margin:22px 0 10px;font-size:1rem">📆 Agendadas (${agendadas.length})</h3>`));
  if(!agendadas.length) v.appendChild(el('<div class="card"><p class="hint" style="margin:0">Nenhuma aula de apoio agendada ainda.</p></div>'));
  agendadas.forEach(ap=>v.appendChild(el(_apoioCard(ap, `<button class="btn ghost sm" onclick="abrirAgendarApoio('${ap.id}')">✏️ Reagendar</button>`))));
};

/* ===== Comunicados por e-mail (b47) ===== */
let _cmAberto=null;
function toggleComunicado(id){ _cmAberto=(_cmAberto===id)?null:id; VIEWS.comunicados(); }
function _cmAlvos(){
  const allEl=document.getElementById('cmAll');
  const all=!!(allEl&&allEl.checked);
  const ativas=(S.turmas||[]).filter(t=>turmaStatus(t)!=='encerrada');
  let sel;
  if(all){ sel=ativas; }
  else { sel=ativas.filter(t=>{ const c=document.getElementById('cm_t_'+t.id); return !!(c&&c.checked); }); }
  const ids=sel.map(t=>t.id);
  const alunos=(S.alunos||[]).filter(a=>!a.arquivado && ids.indexOf(a.turmaId)>=0);
  const map={}; let comEmail=0;
  alunos.forEach(a=>{ const raw=(a.email||'').trim(); if(raw){ comEmail++; map[raw.toLowerCase()]=raw; } });
  return {turmas:sel, ids, alunos, emails:Object.values(map), comEmail, total:alunos.length, escolaToda:all};
}
function renderCmResumo(){
  const box=document.getElementById('cmResumo'); if(!box) return;
  const a=_cmAlvos();
  if(!a.ids.length){ box.innerHTML='<p class="hint" style="margin:0">Escolha as turmas (ou a escola toda) acima.</p>'; return; }
  let h=`<b>${a.emails.length}</b> e-mail(s) único(s) — de ${a.comEmail} aluno(s) com e-mail, num total de ${a.total} aluno(s) na seleção.`;
  if(a.total>a.comEmail) h+=` <span class="hint">(${a.total-a.comEmail} sem e-mail cadastrado ficam de fora)</span>`;
  let cor='#1a8a4a', bg='#eafaf0';
  if(a.emails.length>90){ cor='var(--vermelho)'; bg='#fdeaea'; h+=`<br><b>⚠️ Atenção:</b> o Gmail comum entrega ~100 e-mails/dia. Acima disso o envio pode falhar — divida em partes ou aguarde o Workspace.`; }
  box.innerHTML=`<div class="card" style="background:${bg};color:${cor};padding:10px 12px;margin:8px 0">${h}</div>`;
}
async function enviarComunicado(){
  if(ehProfessor()) return toast('Sem permissão');
  const assunto=(document.getElementById('cmAssunto').value||'').trim();
  const corpo=(document.getElementById('cmCorpo').value||'').trim();
  if(!assunto) return toast('Escreva o assunto');
  if(!corpo) return toast('Escreva a mensagem');
  const a=_cmAlvos();
  if(!a.ids.length) return toast('Escolha ao menos uma turma (ou a escola toda)');
  if(!a.emails.length) return toast('Nenhum responsável com e-mail cadastrado nessa seleção');
  let aviso='';
  if(a.emails.length>90) aviso='\n\nATENÇÃO: '+a.emails.length+' destinatários — acima do limite diário do Gmail comum (~100). Pode falhar.';
  const ondePara=a.escolaToda?'a ESCOLA TODA':(a.turmas.length+' turma(s)');
  if(!confirm('Enviar comunicado para '+ondePara+'?\n\nDestinatários: '+a.emails.length+' responsável(is) em cópia oculta.\nAssunto: '+assunto+aviso)) return;
  const btn=document.getElementById('cmEnviar'); if(btn){ btn.disabled=true; btn.textContent='Enviando…'; }
  const res=await cloudEmail(a.emails, assunto, corpo);
  if(btn){ btn.disabled=false; btn.textContent='✉️ Enviar comunicado'; }
  if(res && res.ok){
    S.comunicados=S.comunicados||[];
    S.comunicados.push({id:uid(),data:hoje(),ts:Date.now(),assunto,corpo,turmas:a.ids.slice(),escolaToda:a.escolaToda,enviados:res.enviados||a.emails.length,por:S.usuario});
    save();
    document.getElementById('cmAssunto').value='';
    document.getElementById('cmCorpo').value='';
    VIEWS.comunicados();
    toast('Comunicado enviado para '+(res.enviados||a.emails.length)+' e-mail(s)');
  } else {
    toast('Não foi possível enviar: '+((res&&res.erro)||'erro'));
  }
}

      return `<div class="card" style="padding:10px 12px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer" onclick="toggleComunicado('${c.id}')">

/* ===== Ficha do Aluno (b49) ===== */
let _fichaAlunoId=null, _fichaDe='', _fichaAte='';
function _fichaTurmasDoAluno(alunoId){
  const ids={};
  const a=(S.alunos||[]).find(x=>x.id===alunoId);
  if(a && a.turmaId) ids[a.turmaId]=true;
  (S.presencas||[]).forEach(p=>{ if(p.registros && (alunoId in p.registros)) ids[p.turmaId]=true; });
  (S.turmas||[]).forEach(t=>{ if((t.alunosSnapshot||[]).some(s=>s.id===alunoId)) ids[t.id]=true; });
  return Object.keys(ids).map(id=>(S.turmas||[]).find(t=>t.id===id)).filter(Boolean);
}
function testesDoAluno(alunoId){
  return (S.testes||[]).filter(t=>t.notas && (alunoId in t.notas))
    .map(t=>({data:t.data,turmaId:t.turmaId,numero:t.numero,nota:t.notas[alunoId]}))
    .sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}
function _fichaAulas(alunoId, turmaIds, de, ate){
  const inRange=d=>(!de||d>=de)&&(!ate||d<=ate);
  const out=[];
  (S.presencas||[]).forEach(p=>{
    if(turmaIds.indexOf(p.turmaId)<0) return;
    if(!p.registros || !(alunoId in p.registros)) return;
    if(!inRange(p.data)) return;
    const rel=(S.relatorios||[]).find(r=>r.turmaId===p.turmaId && r.data===p.data);
    out.push({data:p.data, turmaId:p.turmaId, status:p.registros[alunoId],
      cancelada:p.statusAula==='cancelada', transferida:p.statusAula==='transferida',
      resumo:(rel&&rel.corpo)||resumoAulaDoDia(p.turmaId,p.data)});
  });
  return out.sort((a,b)=>b.data.localeCompare(a.data));
}
function _fichaStreakFaltas(alunoId,turmaId){
  const dois=temAula2(turmaId);
  const sess=(S.presencas||[]).filter(p=>p.turmaId===turmaId && _aulaConta(p) && p.registros && (alunoId in p.registros)).sort((x,y)=>x.data.localeCompare(y.data));

function corpoFichaAluno(alunoId, de, ate){

  const wrsF=(S.writings||[]).filter(w=>w.alunoId===alunoId && inRange(w.data)).sort((x,y)=>x.data.localeCompare(y.data));
  txt+=`\n📝 WRITINGS (${wrsF.length})\n`;
  if(wrsF.length) wrsF.forEach(w=>{ const bt=(w.subscales||Object.keys(w.bands||{})).map(k=>WR_LBL(k)+' '+(w.bands[k]!=null?w.bands[k]:'—')).join(', '); txt+=`• ${brDate(w.data)} — ${w.levelLabel||w.level||''}${w.taskLabel?(' · '+w.taskLabel):''} — Geral ${w.overall_band!=null?w.overall_band:'—'}/5 (${bt})${w.togethere_band?(' · '+w.togethere_band):''}${w.cefr_result?(' · '+w.cefr_result):''}\n`; }); else txt+=`• Nenhum.\n`;

}

function _fichaAulasDet(alunoId, tids, de, ate){
  const inR=d=>(!de||d>=de)&&(!ate||d<=ate);
  const out=[];
  (S.presencas||[]).forEach(p=>{
    if(tids.indexOf(p.turmaId)<0) return;
    if(!p.registros || !(alunoId in p.registros)) return;
    if(!inR(p.data)) return;
    const rel=(S.relatorios||[]).find(r=>r.turmaId===p.turmaId && r.data===p.data);
    const tema=(S.temas||[]).find(t=>t.turmaId===p.turmaId && t.data===p.data);
    const semMat=(S.material||[]).some(m=>m.turmaId===p.turmaId && m.data===p.data && (m.faltantes||[]).includes(alunoId));
    let desc=(rel&&rel.corpo)||''; if(!desc){ try{ desc=resumoAulaDoDia(p.turmaId,p.data)||''; }catch(e){} }
    out.push({ data:p.data, turmaId:p.turmaId, status:p.registros[alunoId],
      cancelada:p.statusAula==='cancelada', transferida:p.statusAula==='transferida',
      atraso:(p.atrasados||[]).includes(alunoId), saiuCedo:(p.saiuCedo||[]).includes(alunoId),
      semMaterial:semMat, descricao:desc, tema: tema?(tema.descricao||''):'' });
  });
  return out.sort((a,b)=>b.data.localeCompare(a.data));
}

function setFiltroTurma(campo,val){ if(campo==='seg')_fSeg=val; else if(campo==='per')_fPer=val; else if(campo==='dia')_fDia=val; else if(campo==='prof')_fProf=val; renderTurmaList(); }
function limparFiltrosTurma(){ _fSeg=_fPer=_fDia=_fProf=''; renderTurmaList(); }
function renderFiltrosTurma(base){
  const ativos=[_fSeg,_fPer,_fDia,_fProf].filter(Boolean).length;
  if(!_filtroAberto){   // recolhido: lista aparece como antes, com um botão discreto
    let resumo='';
    if(ativos){
      const partes=[]; if(_fSeg)partes.push(_fSeg); if(_fPer)partes.push((PERIODOS.find(p=>p[0]===_fPer)||[])[1]||_fPer); if(_fDia)partes.push(_fDia); if(_fProf)partes.push(_fProf);
      resumo=` <span class="hint">${partes.join(' · ')}</span> <button class="btn ghost sm" onclick="limparFiltrosTurma()">limpar</button>`;
    }
    return `<div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn ghost sm" onclick="toggleFiltroTurma()">🔎 Filtrar${ativos?` (${ativos})`:''}</button>${resumo}</div>`;
  }
  const segs=[...new Set(base.map(t=>t.nivel).filter(Boolean))].sort();
  const dias=[...new Set(base.map(t=>diasTurmaLabel(t)).filter(Boolean))].sort();
  const profs=[...new Set(base.map(t=>t.professor).filter(Boolean))].sort();
  const opt=(val,cur,lbl)=>`<option value="${escAttr(val)}" ${cur===val?'selected':''}>${escAttr(lbl)}</option>`;
  const sel=(campo,cur,ph,items)=>`<select onchange="setFiltroTurma('${campo}',this.value)" style="flex:1;min-width:130px">${opt('',cur,ph)}${items.map(it=>opt(it[0],cur,it[1])).join('')}</select>`;
  return `<div class="card" style="padding:12px 14px;margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b>Filtrar turmas e alunos</b>
      <button class="btn ghost sm" onclick="toggleFiltroTurma()">ocultar ▲</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${sel('seg',_fSeg,'Todos os segmentos',segs.map(s=>[s,s]))}
      ${sel('per',_fPer,'Todos os horários',PERIODOS.filter(p=>base.some(t=>periodoTurma(t)===p[0])))}
      ${sel('dia',_fDia,'Todos os dias',dias.map(d=>[d,d]))}
      ${sel('prof',_fProf,'Todos os professores',profs.map(p=>[p,p]))}
      ${_filtroTurmaAtivo()?`<button class="btn ghost sm" onclick="limparFiltrosTurma()">limpar</button>`:''}
    </div></div>`;
}
function renderTurmaList(){
  const list=document.getElementById('turmaList');
  let ts=turmasVisiveis();
  const base=ts.slice();
  if(!base.length){list.innerHTML='<div class="card empty"><div class="big">👥</div>Nenhuma turma. Crie a primeira!</div>';return;}
  const bar = podeVerTodos()? renderFiltrosTurma(base) : '';
  if(podeVerTodos()) ts=ts.filter(turmaPassaFiltro);
  const f=_normTxt(_buscaAluno||'').trim();
  if(f){   // modo busca: lista achatada de alunos que batem (respeitando os filtros)
    const res=[];
    ts.forEach(t=>alunosDa(t.id).forEach(a=>{ if(_normTxt(a.nome).includes(f)) res.push({a,t}); }));
    list.innerHTML = bar + (res.length
      ? `<div class="card"><h3>${res.length} aluno(s) encontrado(s)</h3>`+
        res.map(r=>`<div class="check"><span style="flex:1">${r.a.nome} <span class="pill">${r.t.nome}</span></span>
          <button class="btn ghost sm" onclick="abrirTurma('${r.t.id}')">🏫 Turma</button>
          <button class="btn ghost sm" onclick="abrirFicha('${r.a.id}')">📇 Ficha</button>
          ${(ehProfessor()||soLeitura())?'':`<button class="btn ghost sm" style="color:var(--vermelho)" onclick="delAluno('${r.a.id}')">remover</button>`}</div>`).join('')+`</div>`
      : `<div class="card empty"><div class="big">🔎</div>Nenhum aluno encontrado para “${_buscaAluno}”${_filtroTurmaAtivo()?' com esses filtros':''}.</div>`);
    return;
  }
  if(!ts.length){ list.innerHTML = bar + '<div class="card empty"><div class="big">🔎</div>Nenhuma turma com esses filtros.</div>'; return; }
  list.innerHTML = bar + ts.map(t=>{
    const als=alunosDa(t.id);
    const pend=pendenciasDaTurmaParaMim(t.id);
    const selo=pend.length?`<span class="pill" style="background:#fdeaea;color:var(--vermelho)" title="Pendências nesta turma">⚠️ ${pend.length}</span>`:'';
    const prof=t.professor?` · Prof. ${t.professor}`:'';
    const hor=t.horario?` · ${t.horario}`:'';
    const freq=` · ${diasTurmaLabel(t)||((t.vezesSemana===1)?'1x/sem':'2x/sem')}${t.vezesSemana===1?' (falta dupla)':''}`;
    return `<div class="card" style="cursor:pointer" onclick="abrirTurma('${t.id}')">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1"><h3 style="margin:0">${t.nome} ${nivelTag(t.nivel)}${t.cefr?` <span class="tag teens">${t.cefr}</span>`:''} ${selo}</h3>
          <p class="hint" style="margin:4px 0 0">${als.length} aluno(s)${prof}${hor}${freq}</p></div>
        <span style="font-size:1.7rem;color:var(--azul);line-height:1">›</span>
      </div></div>`;
  }).join('');
}

function importarBackup(input){
  const f=input.files&&input.files[0]; if(!f){return;}
  const r=new FileReader();
  r.onload=function(){

    if(!obj || !obj.usuarios || !obj.alunos){ toast('Arquivo não parece um backup do app'); return; }

// --- parsing da lista (aceita TSV do Copiar e CSV baixado) ---
function _cardsParseLinha(linha, sep){
  const out=[]; let cur='', q=false;
  for(let i=0;i<linha.length;i++){ const c=linha[i];
    if(q){ if(c==='"'){ if(linha[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===sep){ out.push(cur); cur=''; } else cur+=c; } }
  out.push(cur); return out.map(s=>s.trim());
}
function _cardsParse(txt){
  txt=(txt||'').replace(/^﻿/,'');
  const linhas=txt.split(/\r?\n/).filter(x=>x.trim()); if(!linhas.length) return [];
  const l0=linhas[0]; const sep=l0.indexOf('\t')>=0?'\t':(l0.indexOf(';')>=0&&l0.indexOf(',')<0?';':',');
  let idxN=0,idxE=1,idxS=2,ini=0;
  const c0=_cardsParseLinha(l0,sep); const j0=c0.join(' ').toLowerCase();
  if(/aluno|nome|e-?mail|senha|login/.test(j0) && j0.indexOf('@')<0){
    c0.forEach((v,i)=>{ v=v.toLowerCase(); if(/aluno|nome/.test(v))idxN=i; if(/mail|login/.test(v))idxE=i; if(/senha|password/.test(v))idxS=i; });
    ini=1;
  }
  const reg=[];
  for(let i=ini;i<linhas.length;i++){ const c=_cardsParseLinha(linhas[i],sep); if(c.length<2) continue;
    let nome=(c[idxN]||'').trim(), email=(c[idxE]||'').trim(), senha=(c[idxS]||'').trim();
    if(email.indexOf('@')<0){ for(let j=0;j<c.length;j++){ if(c[j].indexOf('@')>=0){ email=c[j].trim(); break; } } }
    if(!email) continue; if(!nome) nome=email.split('@')[0];
    reg.push({nome,email,senha});
  }
  return reg;
}
function _qrSVGcard(texto){ try{ const q=qrcode(0,'M'); q.addData(texto); q.make(); return q.createSvgTag({cellSize:2,margin:0,scalable:true}); }catch(e){ return ''; } }

function _abrirCardsImpressao(grupos, comQR, msg){

};
function _selTurmasOpts(sel){ return turmasVisiveis().slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${t.nome}</option>`).join(''); }
/* ===== Varredura de duplicidades (b44) ===== */
function _normTxt(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function _normNomeAluno(s){ return _normTxt(s); }
function _normNomeTurma(s){ return _normTxt(s).replace(/\([^)]*\)/g,'').replace(/[^a-z0-9+]+/g,''); }
function _refsDaTurma(tid){
  const c={alunos:0,presencas:0,planos:0,temas:0,testes:0,material:0,relatorios:0};
  (S.alunos||[]).forEach(a=>{ if(a.turmaId===tid) c.alunos++; });
  ['presencas','planos','temas','testes','material','relatorios'].forEach(col=>{ (S[col]||[]).forEach(r=>{ if(r&&r.turmaId===tid) c[col]++; }); });
  return c;
}
function _turmaNomePorId(tid){ const t=(S.turmas||[]).find(x=>x.id===tid); return t?t.nome:'(turma inexistente)'; }
function escanearDuplicidades(){
  const turmas=S.turmas||[], alunos=S.alunos||[];
  const tg={};
  turmas.forEach(t=>{ const nk=_normNomeTurma(t.nome); if(!nk) return; const k=nk+'|'+((t.dias||[]).slice().sort((x,y)=>x-y).join(',')); (tg[k]=tg[k]||[]).push(t); });
  const turmasDup=Object.values(tg).filter(g=>g.length>1);
  const ag={};
  alunos.forEach(a=>{ if(a.arquivado) return; const k=_normNomeAluno(a.nome); if(!k) return; (ag[k]=ag[k]||[]).push(a); });
  const alunosDup=Object.values(ag).filter(g=>g.length>1);
  const idsT=new Set(turmas.map(t=>t.id));
  const cols=['presencas','material','temas','testes','planos','relatorios'];
  const orfaos={};
  cols.forEach(c=>{ const arr=(S[c]||[]).filter(r=>r&&r.turmaId && !idsT.has(r.turmaId)); if(arr.length) orfaos[c]=arr; });
  const alunosOrfaos=alunos.filter(a=>a.turmaId && !idsT.has(a.turmaId));
  return {turmasDup, alunosDup, orfaos, alunosOrfaos};
}
function dupDelAluno(id){
  if(ehProfessor()) return toast('Sem permissão');
  const a=(S.alunos||[]).find(x=>x.id===id); if(!a) return;
  if(!confirm('Apagar o aluno duplicado "'+a.nome+'"?\n\nIsto remove SOMENTE este registro. A outra cópia continua no app.')) return;
  S.alunos=(S.alunos||[]).filter(x=>x.id!==id); marcarExcluido('alunos',id);
  save(); VIEWS.dupes(); toast('Aluno duplicado removido');
}
function dupDelTurma(id){
  if(ehProfessor()) return toast('Sem permissão');
  const t=(S.turmas||[]).find(x=>x.id===id); if(!t) return;
  const r=_refsDaTurma(id);
  const temReg=r.alunos||r.presencas||r.planos||r.temas||r.testes||r.material||r.relatorios;
  let msg='Apagar a turma duplicada "'+t.nome+'"?';
  if(temReg){
    msg+='\n\nEsta turma ainda tem:\n• '+r.alunos+' aluno(s)\n• '+r.presencas+' chamada(s)\n• '+r.planos+' plano(s) · '+r.temas+' tema(s) · '+r.testes+' teste(s)\n• '+r.relatorios+' relatório(s)\n\nTUDO isso será apagado junto. Não dá para desfazer.\n\nDica: apague a turma ANTIGA (a que não tem o "(2026)" ou tem menos registros).';
  }
  if(!confirm(msg)) return;
  S.turmas=(S.turmas||[]).filter(x=>x.id!==id); marcarExcluido('turmas',id);
  (S.alunos||[]).filter(a=>a.turmaId===id).forEach(a=>marcarExcluido('alunos',a.id));
  S.alunos=(S.alunos||[]).filter(a=>a.turmaId!==id);
  ['presencas','planos','temas','testes','material','relatorios'].forEach(col=>{
    (S[col]||[]).filter(rr=>rr&&rr.turmaId===id).forEach(rr=>marcarExcluido(col,rr.id));
    S[col]=(S[col]||[]).filter(rr=>!(rr&&rr.turmaId===id));
  });
  save(); montarNav(); VIEWS.dupes(); toast('Turma duplicada removida');
}
function dupDelOrfao(col,id){
  if(ehProfessor()) return toast('Sem permissão');
  if(!confirm('Apagar este registro órfão?\n\nEle pertence a uma turma que não existe mais no app.')) return;
  S[col]=(S[col]||[]).filter(r=>!(r&&r.id===id)); marcarExcluido(col,id);
  save(); VIEWS.dupes(); toast('Registro órfão removido');
}

/* ===== Ciclo de vida da turma (b45) ===== */
const TSTATUS={aberta:{lbl:'ABERTA',cor:'#1a8a4a',bg:'#eafaf0'},formacao:{lbl:'EM FORMAÇÃO',cor:'#b88600',bg:'#fff8e0'},encerrada:{lbl:'ENCERRADA',cor:'#888',bg:'#eeeeee'}};
let _amBusca='';
function turmaStatus(t){ if(!t) return 'aberta'; return t.status || (t.arquivada?'encerrada':'aberta'); }
function turmaTrancada(tid){ const t=(S.turmas||[]).find(x=>x.id===tid); return turmaStatus(t)==='encerrada'; }
function statusPill(t){ const s=TSTATUS[turmaStatus(t)]||TSTATUS.aberta; return `<span class="pill" style="background:${s.bg};color:${s.cor}">${s.lbl}</span>`; }
function encerrarTurma(id){
  if(ehProfessor()) return toast('Sem permissão');
  const t=(S.turmas||[]).find(x=>x.id===id); if(!t) return;
  if(turmaStatus(t)==='encerrada') return toast('Esta turma já está encerrada');
  const als=(S.alunos||[]).filter(a=>a.turmaId===id && !a.arquivado);
  if(!confirm('Encerrar a turma "'+t.nome+'"?\n\nEla vai para o ARQUIVO MORTO guardando os '+als.length+' aluno(s) atuais. Depois de encerrada, NADA nela poderá ser editado.\n\nOs alunos continuam no app e podem ser rematriculados em outra turma pelo "+ Aluno".')) return;
  t.alunosSnapshot=als.map(a=>({id:a.id,nome:a.nome}));
  t.status='encerrada'; t.arquivada=true; t.encerradaEm=hoje();
  if(painelTurma===id) painelTurma=null;
  save(); montarNav(); if(rota==='gturmas') VIEWS.gturmas(); toast('Turma encerrada e arquivada');
}
function iniciarTurma(id){
  if(ehProfessor()) return toast('Sem permissão');
  const t=(S.turmas||[]).find(x=>x.id===id); if(!t) return;
  t.status='aberta'; t.arquivada=false;
  save(); montarNav(); if(rota==='gturmas') VIEWS.gturmas(); toast('Turma aberta');
}

function reusarAluno(aid,turmaId){
  if(ehProfessor()) return toast('Sem permissão');
  if(turmaTrancada(turmaId)) return toast('Turma encerrada');
  const a=(S.alunos||[]).find(x=>x.id===aid); if(!a) return;
  const antiga=a.turmaId;
  if(antiga===turmaId){ fechar(); return toast('Este aluno já está nesta turma'); }
  if(antiga && !turmaTrancada(antiga)){
    if(!confirm(a.nome+' está na turma "'+_turmaNomePorId(antiga)+'". Mover para esta turma?')) return;
  }
  a.turmaId=turmaId; if(a.arquivado) a.arquivado=false;
  save(); fechar(); _refreshTurmas(); montarNav(); toast(a.nome+' adicionado(a)');
}
function criarAlunoNovo(turmaId){
  if(ehProfessor()) return toast('Sem permissão');
  if(turmaTrancada(turmaId)) return toast('Turma encerrada');
  const inp=document.getElementById('aaBusca'); const txt=((inp&&inp.value)||'').trim();
  if(!txt) return toast('Digite o nome');
  const exato=(S.alunos||[]).find(a=>_normTxt(a.nome)===_normTxt(txt));
  if(exato){ if(!confirm('Já existe "'+exato.nome+'" no app (turma: '+_turmaNomePorId(exato.turmaId)+').\n\nCriar mesmo assim um aluno novo? Isso pode gerar duplicidade.')) return; }
  S.alunos.push({id:uid(),nome:txt,turmaId});

}
function renderArquivoMorto(){

/* ---- Aniversariantes da semana (pop-up) ---- */
function aniversariantesSemana(){
  const hoje=new Date(); hoje.setHours(0,0,0,0); const res=[];
  let ids;
  if(S.perfil==='professor'){ const u=S.usuarios.find(x=>x.nome===S.usuario); ids=new Set(S.turmas.filter(t=>!t.arquivada && t.professor===(u&&u.ensina)).map(t=>t.id)); }
  else { ids=new Set(S.turmas.filter(t=>!t.arquivada).map(t=>t.id)); }
  (S.alunos||[]).forEach(a=>{
    if(a.arquivado || !a.nascimento || !ids.has(a.turmaId)) return;
    const p=String(a.nascimento).split('-').map(Number); if(p.length<3||!p[1]||!p[2]) return;
    const yy=p[0],mm=p[1],dd=p[2];
    for(let i=0;i<7;i++){ const d=new Date(hoje); d.setDate(hoje.getDate()+i);
      if(d.getMonth()+1===mm && d.getDate()===dd){ const t=S.turmas.find(x=>x.id===a.turmaId);
        res.push({nome:a.nome, turma:t?t.nome:'', dia:new Date(d), faz:d.getFullYear()-yy}); break; }
    }
  });
  res.sort((a,b)=>a.dia-b.dia);
  return res;
}
let _avisoAniv=false;
function mostrarAniversariantes(){
  if(_avisoAniv) return; _avisoAniv=true;
  const lista=aniversariantesSemana(); if(!lista.length) return;
  modal(`<h3>🎂 Aniversariantes da semana <button class="close" onclick="fechar()">×</button></h3>
    <p class="hint" style="margin-bottom:10px">Alunos que fazem aniversário nos próximos 7 dias:</p>
    ${lista.map(o=>`<div class="check"><span>🎉 <b>${o.nome}</b> — ${brDate(ymd(o.dia))} (${DIAS_SEMANA[o.dia.getDay()]})${(o.faz>0&&o.faz<130)?` · faz ${o.faz}`:''} <span class="pill">${o.turma}</span></span></div>`).join('')}
    <button class="btn block" onclick="fechar()" style="margin-top:12px">Fechar</button>`);
}

(async function boot(){
  const av=document.getElementById('appVer'); if(av) av.textContent=APP_VERSAO;
  _iniciarFilaSync();                       // fila de sincronização offline (reenvia ao voltar a conexão)
  // existe sessão guardada neste aparelho?
  let tk=null,tuser=null,tperfil=null;
  try{ tk=localStorage.getItem(TKEY); tuser=localStorage.getItem(UKEY); tperfil=localStorage.getItem(PKEY); }catch(e){}
  if(tk && tuser && tperfil){
    CLOUD_TOKEN=tk;
    const lp=document.getElementById('loginPanel'); if(lp) lp.innerHTML='<p class="hint" style="text-align:center">Reconectando…</p>';
    const res=await cloudGet(8000);
    if(res.ok && res.state && res.state.usuarios && res.state.usuarios.length){
      let temPend=false; try{ temPend=!!localStorage.getItem(PEND_KEY); }catch(e){}
      let nova=migrar(res.state);
      if(temPend){                           // havia edições offline não enviadas → MESCLA (local vence), não perde
        let loc=null; try{ loc=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
        if(loc){ nova=mergeEstados(nova, migrar(loc)); _pendenteSync=true; }
      }
      S=nova;
      try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
      marcarSync(_pendenteSync?'...':'ok');
    } else if(res.auth){
      // token expirado/cancelado → limpa a sessão e pede login
      CLOUD_TOKEN=null;
      try{ localStorage.removeItem(TKEY); localStorage.removeItem(UKEY); localStorage.removeItem(PKEY); }catch(e){}
      S.usuario=null; S.perfil=null; renderLogin(); return;
    } else {
      try{ if(localStorage.getItem(PEND_KEY)) _pendenteSync=true; }catch(e){}
      marcarSync('off');                     // offline → entra com o estado local (NUNCA sobrescreve a nuvem)
    }
    const u=(S.usuarios||[]).find(x=>x.nome===tuser) || {nome:tuser, perfil:tperfil, ensina:null};
    S.usuario=u.nome; S.perfil=tperfil;
    aplicarLogin(u);
    if(_pendenteSync) setTimeout(flushSync,1200);   // sobe o que ficou pendente do offline
    return;
  }
  // sem sessão → tela de login
  S.usuario=null; S.perfil=null;
  renderLogin();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    (function(){ try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){}); } if(window.caches&&caches.keys){ caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}).catch(function(){}); } }catch(e){} return Promise.resolve({update:function(){},addEventListener:function(){}}); })().then(function(reg){
      try{ reg.update(); }catch(e){}
      setInterval(function(){ try{ reg.update(); }catch(e){} }, 60*60*1000);   // checa de hora em hora (sessões abertas o dia todo)
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){ mostrarAtualizacao(); }  // 'installed' + já há controlador = atualização (não 1ª instalação)
        });
      });
    }).catch(function(){});
  });
}

function _timelineBody(id){

    const pg=(l.pg&&l.pg!=='—')?(' · pp '+l.pg):'';
    rows+='<label '+(here?'id="tlHere" ':'')+'style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;border:.5px solid #e7eef6;border-left:3px solid '+TG_COR[l.t]+';border-radius:8px;background:'+bg+';'+out+'margin-bottom:6px;cursor:pointer">'+
      '<input type="checkbox" '+(dada?'checked':'')+' onchange="_toggleDada(\''+id+'\',\''+key+'\')">'+
      '<span style="font-weight:600;min-width:70px;font-size:.82rem'+(dada?';text-decoration:line-through;opacity:.6':'')+'">Sem '+l.s+' · A'+l.a+'</span>'+

      '<span style="flex:1;min-width:150px;font-size:.85rem'+(dada?';opacity:.6':'')+'"><span>'+esc(l.sec||l.u)+'</span><span style="color:#90a4b8;font-size:.76rem"> — '+esc(l.u)+pg+'</span></span>'+flag+'</label>';
  }
  const _st=(atras>0?('Esta turma está <b>'+atras+' aula(s) atrás</b> do ritmo previsto'):(fi>=les.length?'Plano <b>concluído</b> 🎉':'Esta turma está <b>em dia</b> com o ritmo previsto'));
  return '<p class="hint" style="margin:0 0 10px">'+_st+' · <b>'+pctDone+'%</b> do plano dado ('+dadasCount+'/'+les.length+').</p>'+

/* ---- deslogar por inatividade (b68) ---- */
(function(){
  const MIN=15, MS=MIN*60000; let _last=Date.now(), _tmr=null;
  function _logado(){ return !!(typeof S!=='undefined' && S && S.usuario); }
  function _arm(){ clearTimeout(_tmr); if(!_logado()) return; _tmr=setTimeout(_check, Math.max(1000, MS-(Date.now()-_last))); }
  function _check(){ if(_logado() && Date.now()-_last>=MS){ try{ toast('Sessão encerrada por inatividade'); }catch(e){} try{ logout(); }catch(e){} } else { _arm(); } }
  function _bump(){ _last=Date.now(); _arm(); }
  ['click','keydown','touchstart','pointerdown','scroll'].forEach(function(ev){ try{ document.addEventListener(ev,_bump,{passive:true}); }catch(e){} });
  let _mv=0; try{ document.addEventListener('mousemove',function(){ const n=Date.now(); if(n-_mv>2000){ _mv=n; _bump(); } },{passive:true}); }catch(e){}
  try{ document.addEventListener('visibilitychange',function(){ if(!document.hidden) _check(); }); }catch(e){}
  try{ window.addEventListener('focus',_check); }catch(e){}
  _bump();
})();

/* =========================================================================
   FORMAÇÃO (b89) — metodologia Togethere viva dentro do app
   • Biblioteca de tópicos (conteúdo editável pela direção, mora em S.formacao)
   • Percurso do professor: cada tópico "vence" depois de N meses → volta a
     aparecer como "revisar" (é o que impede o módulo de morrer)
   • Painel da direção: quem está em dia, quem precisa revisar
   • Sessões de formação: a direção registra um treinamento e marca todos os
     participantes de uma vez
   ARMAZENAMENTO: S.formacao / S.formacaoReg / S.formacaoSessoes (em MERGE_COLS,
   com atualizadoEm e marcarExcluido — sincroniza entre aparelhos).
   ========================================================================= */
let _fmAba='biblioteca';

function _fmTopicos(){ return (S.formacao||[]).slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0)); }
function _fmProfs(){ return (S.usuarios||[]).filter(u=>u.ensina).sort((a,b)=>a.nome.localeCompare(b.nome)); }
function _fmEnsino(){ const u=(S.usuarios||[]).find(u=>u.nome===S.usuario); return !!(u&&u.ensina); }
function _fmMesesMs(m){ return (m||6)*30.44*24*3600*1000; }
function _fmUltimo(topicoId, usuario){
  let t=0;
  (S.formacaoReg||[]).forEach(r=>{ if(r.topicoId===topicoId && r.usuario===usuario && (r.ts||0)>t) t=r.ts||0; });
  return t;
}
function _fmStatus(top, usuario){
  const ts=_fmUltimo(top.id, usuario);
  if(!ts) return {k:'novo', ts:0};
  if(Date.now()-ts > _fmMesesMs(top.revisarMeses)) return {k:'revisar', ts};
  return {k:'ok', ts};
}
const _FM_CHIP={
  novo:    {t:'novo',      bg:'#eaf3ff', c:'var(--azul)'},
  revisar: {t:'revisar',   bg:'#fff8e0', c:'#b88600'},
  ok:      {t:'em dia',    bg:'#eafaf0', c:'#1a8a4a'}
};
function _fmChip(k){ const c=_FM_CHIP[k]||_FM_CHIP.novo; return `<span class="tag" style="background:${c.bg};color:${c.c}">${c.t}</span>`; }
function formacaoBadge(){
  if(!_fmEnsino()) return 0;
  return _fmTopicos().filter(t=>_fmStatus(t,S.usuario).k!=='ok').length;
}
/* formatador leve: "## título", "- item", "1. item", **negrito** */
function _fmFmt(txt){
  const linhas=esc(txt||'').split(/\r?\n/);
  let out='', lista=null;
  const fim=()=>{ if(lista){ out+='</'+lista+'>'; lista=null; } };
  linhas.forEach(l=>{
    const s=l.trim();
    if(!s){ fim(); return; }
    if(s.slice(0,3)==='## '){ fim(); out+=`<h4 style="margin:16px 0 6px;font-size:.98rem;color:var(--azul)">${s.slice(3)}</h4>`; return; }
    let m=s.match(/^[-•]\s+(.*)$/);
    if(m){ if(lista!=='ul'){ fim(); out+='<ul style="margin:6px 0 6px 20px">'; lista='ul'; } out+=`<li style="margin:3px 0">${m[1]}</li>`; return; }
    m=s.match(/^\d+[.)]\s+(.*)$/);
    if(m){ if(lista!=='ol'){ fim(); out+='<ol style="margin:6px 0 6px 20px">'; lista='ol'; } out+=`<li style="margin:3px 0">${m[1]}</li>`; return; }
    fim(); out+=`<p style="margin:6px 0">${s}</p>`;
  });
  fim();
  return out.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}

function _fmRenderPercurso(box){
  const tops=_fmTopicos();
  const pend=tops.filter(t=>_fmStatus(t,S.usuario).k!=='ok');
  const ok=tops.filter(t=>_fmStatus(t,S.usuario).k==='ok');
  box.appendChild(el(`<div class="card" style="background:${pend.length?'#fff8e0':'#eafaf0'};padding:14px 16px">
    <b>${pend.length? pend.length+' tópico(s) para ver ou revisar' : 'Tudo em dia 🎉'}</b>
    <p class="hint" style="margin:4px 0 0">Cada tópico volta para revisão depois do prazo definido pela direção.</p></div>`));
  const linha=t=>{
    const st=_fmStatus(t,S.usuario);
    return el(`<div class="card" style="cursor:pointer;padding:14px 16px" onclick="fmAbrir('${t.id}')">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

      <p class="hint" style="margin:6px 0 0">${st.ts? 'Última vez: '+brDate(ymd(new Date(st.ts))) : 'Ainda não registrado'} · revisar a cada ${t.revisarMeses||6} meses</p>
    </div>`);
  };
  if(pend.length){ box.appendChild(el(`<h3 style="margin:18px 0 10px;font-size:1rem">⏳ Pendentes (${pend.length})</h3>`)); pend.forEach(t=>box.appendChild(linha(t))); }
  if(ok.length){ box.appendChild(el(`<h3 style="margin:18px 0 10px;font-size:1rem">✅ Em dia (${ok.length})</h3>`)); ok.forEach(t=>box.appendChild(linha(t))); }
}

function _fmRenderPainel(box){
  const tops=_fmTopicos(), profs=_fmProfs();
  if(!profs.length){ box.appendChild(el('<div class="card empty"><div class="big">👥</div><b>Nenhum professor cadastrado</b><br>Marque o campo "ensina" em Acessos.</div>')); return; }
  box.appendChild(el(`<div style="margin-bottom:14px"><button class="btn" onclick="fmNovaSessao()">📌 Registrar sessão de formação</button></div>`));
  profs.forEach(p=>{
    const sts=tops.map(t=>({t, st:_fmStatus(t,p.nome)}));
    const pend=sts.filter(x=>x.st.k!=='ok').length;

function fmSalvarTopico(id){

    titulo,
    emoji:(document.getElementById('fmEmoji').value||'📘').trim(),
    resumo:(document.getElementById('fmRes').value||'').trim(),
    conteudo:document.getElementById('fmCont').value||'',
    revisarMeses:Math.max(1, +document.getElementById('fmRev').value||6),

function fmSalvarSessao(){
  const topicos=[...document.querySelectorAll('.fsTop:checked')].map(c=>c.value);
  const participantes=[...document.querySelectorAll('.fsPart:checked')].map(c=>c.value);
  if(!topicos.length) return toast('Marque ao menos um tópico');

  const data=document.getElementById('fsData').value||hoje();
  const titulo=(document.getElementById('fsTit').value||'').trim()||'Sessão de formação';
  const notas=(document.getElementById('fsNotas').value||'').trim();
  const sid=uid(), ts=_ymdToTs(data);
  S.formacaoSessoes=S.formacaoSessoes||[];
  S.formacaoSessoes.push({id:sid, data, titulo, topicos, participantes, notas, por:S.usuario, criadoEm:Date.now(), atualizadoEm:Date.now()});
  S.formacaoReg=S.formacaoReg||[];
  participantes.forEach(p=>topicos.forEach(tid=>{
    S.formacaoReg.push({id:uid(), topicoId:tid, usuario:p, ts, tipo:'sessao', sessaoId:sid, atualizadoEm:Date.now()});

  save(); fechar(); _fmAba='sessoes'; VIEWS.formacao(); montarNav();

## PNL — canais de comunicação
